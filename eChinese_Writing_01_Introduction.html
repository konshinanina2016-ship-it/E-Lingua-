ство: имя, возраст, семья, учёба и увлечения. <strong>B1</strong> — более подробный рассказ с деталями о родном городе. <strong>B2</strong> — развёрнутое представление себя, целей знакомства и интересов.</p></div></div><div class=\"step\"><span>02</span><div><b>Прочитайте китайский текст</b><p>Сначала прочитайте образец целиком. Определите, кому автор пишет, что сообщает о себе и какими словами завершает знакомство. Затем прочитайте ещё раз по абзацам.</p></div></div><div class=\"step\"><span>03</span><div><b>Освойте лексику и конструкции</b><p>На следующих страницах найдите новые слова с пиньинем и переводом. Выпишите полезные выражения и попробуйте заменить в них сведения об авторе своими.</p></div></div><div class=\"step\"><span>04</span><div><b>Изучите заметки и план</b><p>Обратите внимание на абзацы, китайские знаки препинания и структуру письма. План подскажет, в какой последовательности излагать мысли.</p></div></div><div class=\"step\"><span>05</span><div><b>Напишите и проверьте работу</b><p>Откройте страницу «Напишите самостоятельно» своего уровня, составьте оригинальный текст и сверьтесь с памяткой. Черновик сохраняется в этом браузере; кнопка «Сохранить PDF» позволяет подготовить работу для учителя.</p></div></div></div><div class=\"panel\"><b>Как перелистывать?</b> Используйте стрелки по краям книги или клавиши ← →. Кнопка «Содержание» возвращает к списку разделов. На небольшом экране листайте и прокручивайте страницы.</div>","<div class=\"toc-page\"><span class=\"tag\">自我介绍 · Учебный маршрут</span><h1>Содержание</h1><p>Нажмите на название, чтобы перейти к нужной части книги.</p><div class=\"toc-list\"><button class=\"toc-item\" onclick=\"jump(1)\"><span class=\"toc-dot\">01</span><span class=\"toc-desc\"><small>Знакомство с книгой</small><b>Как пользоваться книгой</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(3)\"><span class=\"toc-dot\">02</span><span class=\"toc-desc\"><small>Уровень A</small><b>Образец текста</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(4)\"><span class=\"toc-dot\">03</span><span class=\"toc-desc\"><small>Уровень A</small><b>Новые слова и выражения</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(5)\"><span class=\"toc-dot\">04</span><span class=\"toc-desc\"><small>Уровень A</small><b>Как построен текст</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(6)\"><span class=\"toc-dot\">05</span><span class=\"toc-desc\"><small>Уровень B1</small><b>Образец текста</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(7)\"><span class=\"toc-dot\">06</span><span class=\"toc-desc\"><small>Уровень B1</small><b>Новые слова и выражения</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(8)\"><span class=\"toc-dot\">07</span><span class=\"toc-desc\"><small>Уровень B1</small><b>Как построен текст</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(9)\"><span class=\"toc-dot\">08</span><span class=\"toc-desc\"><small>Уровень B2</small><b>Образец текста</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(10)\"><span class=\"toc-dot\">09</span><span class=\"toc-desc\"><small>Уровень B2</small><b>Новые слова и выражения</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(11)\"><span class=\"toc-dot\">10</span><span class=\"toc-desc\"><small>Уровень B2</small><b>Как построен текст</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(12)\"><span class=\"toc-dot\">11</span><span class=\"toc-desc\"><small>Письменная мастерская</small><b>Заметки о китайском письме</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(13)\"><span class=\"toc-dot\">12</span><span class=\"toc-desc\"><small>Письменная мастерская</small><b>Ещё полезные заметки</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(14)\"><span class=\"toc-dot\">13</span><span class=\"toc-desc\"><small>Письменная мастерская</small><b>Сравнение уровней</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(15)\"><span class=\"toc-dot\">14</span><span class=\"toc-desc\"><small>Письменная мастерская</small><b>План собственного текста</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(16)\"><span class=\"toc-dot\">15</span><span class=\"toc-desc\"><small>Практика</small><b>Напишите самостоятельно · A</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(17)\"><span class=\"toc-dot\">16</span><span class=\"toc-desc\"><small>Практика</small><b>Напишите самостоятельно · B1</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(18)\"><span class=\"toc-dot\">17</span><span class=\"toc-desc\"><small>Практика</small><b>Напишите самостоятельно · B2</b></span><span class=\"toc-arr\">›</span></button><button class=\"toc-item\" onclick=\"jump(19)\"><span class=\"toc-dot\">18</span><span class=\"toc-desc\"><small>Завершение</small><b>Проверка и сохранение работы</b></span><span class=\"toc-arr\">›</span></button></div></div>","<span class=\"tag\">Уровень A</span><h2>Образец A · 自我介绍</h2><div class=\"panel\"><strong>Полный образец из Writing Guide</strong> · Уровень A</div><div class=\"cn\">你好！\n我的名字叫Lily Johnson, 我的中文名字是张丽丽。我19岁了,我是1981年生的,我的生日是7月15号。我一米六八,55公斤。我的朋友们说我太瘦了，但是他们觉得我很漂亮。我想我没有那么好看，只是还可以。\n我父亲是医生，我母亲是小学老师。我有一个哥哥和一个妹妹。我家在旧金山，但是我在华盛顿州立大学念二年级。我的专业是历史和中文。我喜欢爬山、打排球、打网球和看电影。因为我学中文，所以我想跟中国人交朋友。我希望你会成为我的朋友。\n你多大了？你念大学几年级？你家在哪儿？你有没有兄弟姐妹？你的父母做什么工作？你喜欢做什么？你的生日是几月几日？请你给我回信，好不好？\n祝你快乐！\n丽丽</div>","<span class=\"tag\">Уровень A</span><h2>Слова к образцу A</h2><div class=\"panel\">Новые слова и выражения из образца. Прочитайте, найдите их в тексте и используйте в собственном письме.</div><table class=\"wordtable\"><tr><td>自我介绍</td><td>zìwǒ jièshào</td><td>представление себя</td></tr><tr><td>没有那么</td><td>méiyǒu nàme</td><td>не настолько</td></tr><tr><td>只是</td><td>zhǐshì</td><td>только, всего лишь</td></tr><tr><td>旧金山</td><td>Jiùjīnshān</td><td>Сан-Франциско</td></tr><tr><td>华盛顿</td><td>Huáshèngdùn</td><td>Вашингтон</td></tr><tr><td>州立大学</td><td>zhōulì dàxué</td><td>университет штата</td></tr><tr><td>专业</td><td>zhuānyè</td><td>специальность</td></tr><tr><td>爬山</td><td>páshān</td><td>ходить в горы</td></tr><tr><td>打排球</td><td>dǎ páiqiú</td><td>играть в волейбол</td></tr><tr><td>网球</td><td>wǎngqiú</td><td>теннис</td></tr><tr><td>跟……交朋友</td><td>gēn…jiāo péngyou</td><td>подружиться с кем-либо</td></tr><tr><td>成为</td><td>chéngwéi</td><td>стать</td></tr><tr><td>回信</td><td>huíxìn</td><td>ответить письмом</td></tr><tr><td>祝你快乐</td><td>zhù nǐ kuàilè</td><td>желаю радости</td></tr></table>","<span class=\"tag\">Уровень A</span><h2>Разбираем образец A</h2><div class=\"panel\"><b>Задача:</b> познакомиться с новым человеком письменно. Представьтесь, расскажите о семье, учёбе и увлечениях, затем задайте вопросы адресату.</div><div class=\"construct\"><b>我的名字叫……</b><p>Меня зовут…</p></div><div class=\"construct\"><b>我的专业是……</b><p>Моя специальность — …</p></div><div class=\"construct\"><b>因为……所以……</b><p>Поскольку… поэтому…</p></div><div class=\"construct\"><b>我希望……</b><p>Я надеюсь, что…</p></div><div class=\"construct\"><b>请你给我回信，好不好？</b><p>Напишите мне в ответ, хорошо?</p></div>","<span class=\"tag\">Уровень B1</span><h2>Образец B1 · 自我介绍</h2><div class=\"panel\"><strong>Полный образец из Writing Guide</strong> · Уровень B1</div><div class=\"cn\">你好！\n我叫张玉，是一个大三学生。我在美国的加州大学学习儿童教育。我来自中国四川的成都。我的家乡的最有名的东西是有麻辣味道的菜和举世闻名的大熊猫。我们城市有一个熊猫基地，有七、八十只大熊猫！如果你有一天会来成都，我一定会带你去看大熊猫。\n我也会带你去吃成都最好吃的东西，成都有很多小吃，都非常好吃，你肯定能找到你最喜欢吃的东西。我也会带你去看成都最好玩的、最好看的地方。\n我是一个独生女，爸爸是医生，妈妈是一个大学教授。你呢？你有兄弟姐妹吗？你来自哪里呢？是一个学生还是已经工作了呢？可以请你给我写信吗？我很希望我们能够成为朋友。\n祝好！\n你的新朋友</div>","<span class=\"tag\">Уровень B1</span><h2>Слова к образцу B1</h2><div class=\"panel\">Новые слова и выражения из образца. Прочитайте, найдите их в тексте и используйте в собственном письме.</div><table class=\"wordtable\"><tr><td>大三</td><td>dàsān</td><td>третий курс</td></tr><tr><td>加州</td><td>Jiāzhōu</td><td>Калифорния</td></tr><tr><td>儿童教育</td><td>értóng jiàoyù</td><td>образование детей</td></tr><tr><td>来自</td><td>láizì</td><td>быть родом из</td></tr><tr><td>成都</td><td>Chéngdū</td><td>Чэнду</td></tr><tr><td>有麻辣味道</td><td>yǒu málà wèidào</td><td>иметь остро-пряный вкус</td></tr><tr><td>举世闻名</td><td>jǔshì wénmíng</td><td>всемирно известный</td></tr><tr><td>大熊猫</td><td>dà xióngmāo</td><td>большая панда</td></tr><tr><td>基地</td><td>jīdì</td><td>база, центр</td></tr><tr><td>小吃</td><td>xiǎochī</td><td>закуски, уличная еда</td></tr><tr><td>肯定</td><td>kěndìng</td><td>наверняка</td></tr><tr><td>独生女</td><td>dúshēngnǚ</td><td>единственная дочь</td></tr></table>","<span class=\"tag\">Уровень B1</span><h2>Разбираем образец B1</h2><div class=\"panel\"><b>Задача:</b> сделать знакомство живым и запоминающимся: рассказать о родном городе, местной еде и достопримечательностях, предложить совместные занятия.</div><div class=\"construct\"><b>我来自……</b><p>Я родом из…</p></div><div class=\"construct\"><b>如果你……我一定会……</b><p>Если ты…, я обязательно…</p></div><div class=\"construct\"><b>你肯定能……</b><p>Ты наверняка сможешь…</p></div><div class=\"construct\"><b>我很希望我们能够成为朋友。</b><p>Очень надеюсь, что мы сможем стать друзьями.</p></div>","<span class=\"tag\">Уровень B2</span><h2>Образец B2 · 自我介绍</h2><div class=\"panel\"><strong>Полный образец из Writing Guide</strong> · Уровень B2</div><div class=\"cn\">你好！\n我的名字是大卫。我今年24岁了。我希望能找到一些愿意跟我一起出去玩、旅行或者愿意带我认识一下洛杉矶的朋友们。\n我刚刚搬到洛杉矶，所以我希望能更多地了解一下洛杉矶。我很喜欢去咖啡馆喝咖啡、去餐馆、看电影、参观博物馆、去公园玩。我很希望能知道哪里是这个城市里最有意思的地方、哪里是最好的购物的地点、最有特色的餐馆、最好玩的地方以及这个城市的一些有意思的历史。\n我喜欢旅游、烹调、摄影、阅读、听音乐，特别是交响乐，以及自己动手做东西。我也很喜欢认识新朋友, 我也非常愿意和朋友们一起做团体活动。\n我会很高兴认识你！\n王大卫</div>","<span class=\"tag\">Уровень B2</span><h2>Слова к образцу B2</h2><div class=\"panel\">Новые слова и выражения из образца. Прочитайте, найдите их в тексте и используйте в собственном письме.</div><table class=\"wordtable\"><tr><td>愿意</td><td>yuànyì</td><td>быть готовым, желать</td></tr><tr><td>或者</td><td>huòzhě</td><td>или (в утверждении)</td></tr><tr><td>洛杉矶</td><td>Luòshānjī</td><td>Лос-Анджелес</td></tr><tr><td>了解</td><td>liǎojiě</td><td>узнавать, понимать</td></tr><tr><td>咖啡馆</td><td>kāfēiguǎn</td><td>кафе</td></tr><tr><td>参观</td><td>cānguān</td><td>посещать (музей и т. п.)</td></tr><tr><td>购物</td><td>gòuwù</td><td>делать покупки</td></tr><tr><td>地点</td><td>dìdiǎn</td><td>место</td></tr><tr><td>特色的</td><td>tèsè de</td><td>особенный, характерный</td></tr><tr><td>以及</td><td>yǐjí</td><td>а также</td></tr><tr><td>烹调</td><td>pēngtiáo</td><td>готовить пищу</td></tr><tr><td>摄影</td><td>shèyǐng</td><td>фотография</td></tr><tr><td>阅读</td><td>yuèdú</td><td>чтение</td></tr><tr><td>特别是</td><td>tèbié shì</td><td>особенно</td></tr><tr><td>交响乐</td><td>jiāoxiǎngyuè</td><td>симфоническая музыка</td></tr><tr><td>动手做东西</td><td>dòngshǒu zuò dōngxi</td><td>мастерить своими руками</td></tr><tr><td>团体活动</td><td>tuántǐ huódòng</td><td>групповые занятия</td></tr></table>","<span class=\"tag\">Уровень B2</span><h2>Разбираем образец B2</h2><div class=\"panel\"><b>Задача:</b> найти друзей в новом городе. Уточните, что вы недавно переехали, какие места хотите узнать и чем любите заниматься.</div><div class=\"construct\"><b>我刚刚搬到……</b><p>Я только что переехал(а) в…</p></div><div class=\"construct\"><b>我希望能更多地了解……</b><p>Я хотел(а) бы узнать больше о…</p></div><div class=\"construct\"><b>特别是……</b><p>Особенно…</p></div><div class=\"construct\"><b>以及……</b><p>А также…</p></div><div class=\"construct\"><b>我会很高兴认识你！</b><p>Буду очень рад(а) познакомиться!</p></div>","<span class=\"tag\">Тема 1.1 · 自我介绍</span><h2>Большие заметки · 写作笔记</h2><div class=\"panel\"><b class=\"red\">Абзац</b><p>В китайском рукописном тексте новый абзац обычно начинают с отступа в два иероглифа. Между абзацами традиционно не оставляют пустую строку.</p></div><div class=\"panel\"><b class=\"red\">Даты и числа</b><p>Даты пишут в порядке год → месяц → день: 2016年1月1日. Возраст, адреса и время часто записывают арабскими цифрами.</p></div><div class=\"panel\"><b class=\"red\">Рост и вес</b><p>Для точности допустимы 1.68米 или 168公分. В образце A встречается и форма 一米六八.</p></div>","<span class=\"tag\">Тема 1.1 · 自我介绍</span><h2>Большие заметки · продолжение</h2><div class=\"panel\"><b class=\"red\">Перечисление с 、</b><p>Знак 、 разделяет однородные существительные или определения: 苹果、桔子和梨. Он не заменяет запятую между самостоятельными частями предложения.</p></div><div class=\"panel\"><b class=\"red\">Приблизительное количество</b><p>七、八十只大熊猫 означает приблизительно 70–80 панд. Это не то же самое, что перечисление двух отдельных количеств.</p></div><div class=\"panel\"><b class=\"red\">Завершение письма</b><p>Пожелания 祝你快乐！ или 祝好！ пишут на отдельной строке; после пожелания не ставят английскую запятую. Подпись размещают ниже.</p></div>","<span class=\"tag\">Тема 1.1 · 自我介绍</span><h2>Сравните три уровня</h2><table class=\"wordtable\"><tr><td>A</td><td>Основные факты: имя, возраст, семья, учёба, интересы, вопросы.</td></tr><tr><td>B1</td><td>Родной город, культурные детали, приглашение, общение.</td></tr><tr><td>B2</td><td>Цель знакомства, предпочтения, описание города и занятий.</td></tr></table><div class=\"panel\">Вопрос для обсуждения: кому адресован каждый текст и с какой целью автор пишет? Выделите в образцах фразы, которые сможете использовать сами.</div>","<span class=\"tag\">Тема 1.1 · 自我介绍</span><h2>План своего письма · отдельная страница</h2><ol><li><b>Обращение:</b> 你好！</li><li><b>Абзац 1:</b> имя, китайское имя, возраст, внешность.</li><li><b>Абзац 2:</b> семья, родной город, учёба или работа, интересы, планы.</li><li><b>Абзац 3:</b> вопросы собеседнику, предложение продолжить переписку.</li><li><b>Заключение:</b> 祝好！ и подпись.</li></ol><div class=\"panel\">Для уровня A достаточно простых предложений. Для B1 добавьте детали и приглашение. Для B2 объясните цель знакомства и используйте связки.</div>","<span class=\"tag\">Ваш текст · уровень A</span><h2>Напишите самостоятельно · A</h2><div class=\"panel\">Выберите сведения о себе, используйте план и конструкции. Текст должен быть вашим, а не копией образца.</div><textarea class=\"write\" id=\"answer-A\" placeholder=\"你好！\n　　我叫……\"></textarea><p>Черновик сохраняется автоматически в этом браузере.</p>","<span class=\"tag\">Ваш текст · уровень B1</span><h2>Напишите самостоятельно · B1</h2><div class=\"panel\">Выберите сведения о себе, используйте план и конструкции. Текст должен быть вашим, а не копией образца.</div><textarea class=\"write\" id=\"answer-B1\" placeholder=\"你好！\n　　我叫……\"></textarea><p>Черновик сохраняется автоматически в этом браузере.</p>","<span class=\"tag\">Ваш текст · уровень B2</span><h2>Напишите самостоятельно · B2</h2><div class=\"panel\">Выберите сведения о себе, используйте план и конструкции. Текст должен быть вашим, а не копией образца.</div><textarea class=\"write\" id=\"answer-B2\" placeholder=\"你好！\n　　我叫……\"></textarea><p>Черновик сохраняется автоматически в этом браузере.</p>","<span class=\"tag\">Тема 1.1 · 自我介绍</span><h2>Проверьте и сохраните</h2><div class=\"panel\">✓ Есть обращение и подпись? ✓ Текст разбит на абзацы? ✓ Указаны цель знакомства и сведения о себе? ✓ Использованы нужные конструкции? ✓ В конце есть вопросы адресату?</div><p>Кнопка «Сохранить PDF» формирует отдельный печатный лист с вашими текстами и выбранными уровнями. В окне печати выберите «Сохранить как PDF».</p><p>«Сбросить ответы» очищает только ваши черновики, не затрагивая образцы.</p>"];let spread=0;function jump(i){spread=Math.floor(i/2);render()}const left=document.getElementById('left'),right=document.getElementById('right'),book=document.getElementById('book');function render(){let n=spread*2;left.innerHTML=pages[n]||'';right.innerHTML=pages[n+1]||'';left.scrollTop=0;right.scrollTop=0;book.classList.remove('flip');void book.offsetWidth;book.classList.add('flip');document.getElementById('counter').textContent='';document.querySelectorAll('textarea').forEach(x=>{x.value=localStorage.getItem('eChinesePilot_'+x.id)||'';x.addEventListener('input',()=>localStorage.setItem('eChinesePilot_'+x.id,x.value))})}function go(d){spread=Math.max(0,Math.min(Math.ceil(pages.length/2)-1,spread+d));render()}function toc(){spread=1;render()}function reset(){if(confirm('Удалить все ваши ответы?')){['A','B1','B2'].forEach(x=>localStorage.removeItem('eChinesePilot_answer-'+x));render()}}function savePDF(){let text=['A','B1','B2'].map(x=>'<h2>Уровень '+x+'</h2><div style="white-space:pre-wrap;font-size:19px;line-height:2">'+(localStorage.getItem('eChinesePilot_answer-'+x)||'Не заполнено').replaceAll('&','&amp;').replaceAll('<','&lt;')+'</div>').join('');let w=window.open('','_blank');if(!w){alert('Разрешите всплывающие окна для сохранения PDF');return}w.document.write('<!doctype html><html><meta charset="utf-8"><title>Моё письмо · 自我介绍</title><style>body{font-family:Arial,KaiTi,sans-serif;margin:35px;color:#172a39}h1{color:#156b9c}h2{border-bottom:2px solid #b8dff5}</style><h1>eChinese · 自我介绍 · Мои письменные работы</h1>'+text+'</html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();</script></body></html>
