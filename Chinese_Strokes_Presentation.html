case'structure':return `<h1>${s.title}</h1><div class="columns"><div><div class="listrow"><b class="zh">笔画</b> ${py('bǐhuà')}Черта: одно движение без отрыва руки.</div><div class="listrow"><b class="zh">偏旁</b> ${py('piānpáng')}Компонент: часть иероглифа.</div><div class="listrow"><b class="zh">部首</b> ${py('bùshǒu')}Ключ: элемент для словарной классификации.</div></div><div style="text-align:center">${zh('亻 + 木 = 休','big')}${py('rén · mù · xiū')}<p>Человек + дерево = отдыхать</p><p class="note">В 休 компонент 亻 служит ключом.<br>Традиционная система включает 214 ключей.</p></div></div>`;
case'groups':return `<h1>${s.title}</h1><div class="columns"><div><div class="listrow"><b>Простые</b><p class="zh">点、横、竖、撇、捺、提</p></div><div class="listrow"><b>С крюком и подъёмом</b><p class="zh">竖钩、竖提、卧钩</p></div><div class="listrow"><b>Ломаные</b><p class="zh">横折、竖折、撇点</p></div><div class="listrow"><b>Ломаные с крюком</b><p class="zh">横折钩、横折弯钩</p></div></div><div>${svg([strokes[18][4]],-1,true)}<p class="note">Повороты и крюк могут входить в одну черту. Руку от бумаги не отрываем.</p></div></div>`;
case'basic':{let i=s.ids[0],a=strokes[i];let directions=['Короткое движение вправо вниз.','Движение слева направо.','Движение сверху вниз.','Движение справа сверху влево вниз.','Движение слева сверху вправо вниз.','Движение слева снизу вправо вверх.'];return `<h1>${s.title}</h1><div class="columns"><div>${svg([a[4]],-1,true)}<p class="hint" style="text-align:center">Золотая точка отмечает начало движения.</p></div><div>${zh(a[0],'big')}${py(a[1])}<p class="lead">${directions[i]}</p><p>Найдите эту черту:</p><div class="examples zh">${a[3]}</div><p class="note">✍️ Проведите черту в воздухе. Затем напишите её пять раз на бумаге.</p><button onclick="render()">Повторить движение</button></div></div>`}

case'relations':return `<h1>${s.title}</h1><div class="triple">${[['二','Не соприкасаются','两横 не касаются друг друга.'],['人','Соприкасаются','Две откидные встречаются.'],['十','Пересекаются','Вертикальная проходит через горизонтальную.']].map(a=>`<div style="text-align:center"><div class="zh mega">${a[0]}</div><h2>${a[1]}</h2><p>${a[2].replace('两横','Две горизонтальные')}</p></div>`).join('')}</div><p class="note">✍️ Покажите место соединения или пересечения в каждом примере.</p>`;

case'components':return `<h1>${s.title}</h1><div class="columns"><div><div class="zh big">木　人</div><h2>Простые</h2><p>Рассматриваем как одну графему, состоящую из черт.</p></div><div><div class="zh big">休　好</div><h2>Составные</h2><p>Различаем несколько компонентов: 亻 + 木, 女 + 子.</p></div></div><p class="note">Структура показывает, как части располагаются внутри общего квадрата. Она помогает видеть строение знака.</p>`;
case'layouts':return `<h1>${s.title}</h1><div class="${s.items.length===3?'triple':'columns'}">${s.items.map(a=>`<article style="text-align:center"><div class="zh" style="font-size:64px;color:#c17a34">${a[0]}</div><h2>${a[1]}</h2><div class="zh big">${a[2]}</div>${py(a[3])}<p class="zh" style="font-size:30px">${a[4]}</p><p>${a[5]}</p></article>`).join('')}</div><p class="note">✍️ Нарисуйте схему расположения частей. Впишите знак в одну клетку. Схема структуры сама по себе не задаёт порядок черт.</p>`;
case'nested':return `<h1>${s.title}</h1><div class="columns"><div style="text-align:center"><div class="zh mega">想</div>${py('xiǎng')}<p>думать, хотеть</p></div><div><h2>Сначала крупные части</h2><p class="zh" style="font-size:40px">想 = 相 + 心</p><p>相 сверху, 心 снизу.</p><h2>Затем внутреннее устройство</h2><p class="zh" style="font-size:40px">相 = 木 + 目</p><p>В верхней части 木 слева, 目 справа.</p></div></div><p class="note">✍️ Обведите верхнюю и нижнюю части. Разделите верхнюю часть ещё раз. Положение компонента может менять его пропорции.</p>`;
case'copybook':{const a=strokes[copyId];return `<h1>${s.title}</h1><select id="strokeSelect" onchange="setStroke(this.value)" aria-label="Выбор черты">${strokes.map((a,i)=>`<option value="${i}" ${i===copyId?'selected':''}>${i+1}. ${a[0]} — ${a[2]}</option>`).join('')}</select><p>${zh(a[0])} <span class="py">${a[1]}</span> · ${a[2]}</p><div class="triple copyrow"><div><h2>Образец</h2><div class="staticstroke">${svg([a[4]])}</div></div><div><h2>Как писать</h2>${svg([a[4]])}<button onclick="replayStroke()">Повторить</button></div><div><h2>Моя черта</h2><canvas id="paper" width="720" height="720" aria-label="Пустая клетка для самостоятельного написания черты"></canvas><div class="toolbar"><button onclick="clearPaper()">Очистить</button><button onclick="undo()">Отменить</button></div></div></div><p class="hint">Золотая точка показывает начало движения. Повторите движение в пустой клетке без отрыва руки.</p>`;}

case'practice':return `<h1>${s.title}</h1><div class="columns"><div><canvas id="paper" width="720" height="720" aria-label="Поле для письма"></canvas><div class="toolbar"><button onclick="clearPaper()">Очистить поле</button><button onclick="undo()">Отменить черту</button></div></div><div><p class="lead">Напишите знак по образцу</p><select id="model" aria-label="Образец иероглифа" onchange="changeModel()">${Object.keys(paths).map(c=>`<option>${c}</option>`).join('')}</select><div class="zh big" id="sample">十</div><p>Можно писать мышью, пальцем или стилусом.</p><p class="note">Проверьте себя:<br>□ порядок черт<br>□ направление<br>□ пропорции и поля</p><p class="hint">Поле предназначено для тренировки. Презентация не оценивает почерк автоматически.</p></div></div>`;
case'end':return `<h1>${s.title}</h1><div class="columns"><div class="checklist">${['Различаю шесть простых черт','Замечаю крюки и повороты','Считаю черты без отрыва руки','Пользуюсь правилами порядка','Удерживаю знак внутри клетки','Нахожу графемы, ключи и фонетики','Различаю расположение частей'].map((t,i)=>`<label><input type="checkbox" data-check="${i}" onchange="checks[${i}]=this.checked" ${checks[i]?'checked':''}> ${t}</label>`).join('')}</div><div style="text-align:center">${zh('加油！','big')}${py('jiāyóu')}<p class="lead">Продолжай, у тебя получится!</p><p class="note">Домашняя практика: 一、十、人、三、口、木.<br>Напишите каждый знак по три раза и назовите знакомые черты.</p></div></div>`;
case'sources':return `<h1>${s.title}</h1><div class="source"><p>Основа урока: «Черты китайских иероглифов», сайт «Уроки Китайского».</p><p><a href="https://xn----8sbjrbhccd6aibowmi.xn--p1ai/cherty-kitajskih-ieroglifov/" target="_blank" rel="noopener">Открыть исходную статью</a></p><p>Раздел структур: <a href="https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-18/" target="_blank" rel="noopener">Unicode, глава 18</a>. Статья ВК недоступна при подготовке дополнения, её содержание не использовано.</p><p>Ключи и формы: Unicode, глава 18. Смысловые и фонетические компоненты: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9533290/" target="_blank" rel="noopener">Learning to read Chinese (2022)</a>. Примеры и упражнения адаптированы для начинающих.</p><p>Сопоставление форм черт: <a href="https://www.unicode.org/charts/PDF/U31C0.pdf" target="_blank" rel="noopener">Unicode, CJK Strokes</a>.</p><p class="note">В презентации исправлены перепутанные названия 横折 / 横撇 и неудачные примеры отдельных черт. 偏旁 обозначает компонент, 部首 обозначает словарный ключ. Число 214 относится к традиционной системе ключей.</p><p>Здесь представлены 25 учебных форм из статьи. В разных классификациях наборы и названия могут различаться. 横斜钩 показана в 飞. Форма в 乙 обычно называется 横折弯钩 или 横斜弯钩.</p><p class="hint">Схемы и задания, включая упражнения на графемы, созданы для этой презентации. Задание из статьи ВК не перенесено: требуется её текст или скриншот. Общие правила порядка имеют исключения. Содержимое работает без интернета, внешние ссылки требуют подключения. Для PDF откройте печать и выберите «Сохранить как PDF».</p></div>`;

function markPinyin(){const walk=document.createTreeWalker($('slide'),NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const n of nodes){if(n.parentElement.closest('.py,script,style,option'))continue;const text=n.textContent;const re=/\b(?:kǒu|mù|míng|héng|shù|piě|nà|tí)\b/gu;if(!re.test(text))continue;re.lastIndex=0;const frag=document.createDocumentFragment();let start=0;for(const m of text.matchAll(re)){frag.append(text.slice(start,m.index));const span=document.createElement('span');span.className='py inlinepy';span.textContent=m[0];span.style.fontSize='inherit';span.style.display='inline';frag.append(span);start=m.index+m[0].length}frag.append(text.slice(start));n.replaceWith(frag)}}const checks={};function render(){ $('slide').innerHTML=content(slides[index]);markPinyin();$('position').textContent=`${index+1} / ${slides.length}`;$('jump').value=index;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;$('bar').style.width=((index+1)/slides.length*100)+'%';if(['practice','copybook'].includes(slides[index].kind))initCanvas();}function go(i){index=Math.min(slides.length-1,Math.max(0,i));render();window.scrollTo({top:0,behavior:'instant'})}function choose(i){answers[index]=i;render()}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('jump').innerHTML=slides.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join('');$('jump').onchange=e=>go(+e.target.value);$('tocList').innerHTML=slides.map((s,i)=>`<button onclick="go(${i});$('contents').close()">${i+1}. ${s.title}</button>`).join('');$('tocBtn').onclick=()=>$('contents').showModal();$('closeToc').onclick=()=>$('contents').close();$('pyBtn').onclick=()=>{let h=document.body.classList.toggle('hidepy');$('pyBtn').textContent=h?'Показать пиньинь':'Скрыть пиньинь';$('pyBtn').setAttribute('aria-pressed',h)};$('resetBtn').onclick=()=>{Object.keys(drillAnswers).forEach(k=>delete drillAnswers[k]);Object.keys(answers).forEach(k=>delete answers[k]);Object.keys(checks).forEach(k=>delete checks[k]);drawing=[];go(0);$('status').textContent='Ответы сброшены. Можно начинать с новым учеником.'};$('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('status').textContent='На этом устройстве используйте полноэкранный режим браузера.'}catch(e){$('status').textContent='Полноэкранный режим недоступен в этом окне. Откройте скачанный файл в браузере.'}};document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'Свернуть экран':'На весь экран'});document.addEventListener('keydown',e=>{if($('contents').open||['SELECT','INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});
let pen=false;function repaint(){let c=$('paper');if(!c)return;let x=c.getContext('2d');x.clearRect(0,0,720,720);x.strokeStyle='#185e60';x.lineWidth=9;x.lineCap='round';x.lineJoin='round';for(let line of drawing){if(!line.length)continue;x.beginPath();x.moveTo(...line[0]);line.slice(1).forEach(p=>x.lineTo(...p));if(line.length===1)x.lineTo(line[0][0]+.1,line[0][1]+.1);x.stroke()}}function initCanvas(){let c=$('paper');repaint();const point=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*720/r.height]};c.onpointerdown=e=>{e.preventDefault();pen=true;c.setPointerCapture(e.pointerId);drawing.push([point(e)]);repaint()};c.onpointermove=e=>{if(pen){drawing[drawing.length-1].push(point(e));repaint()}};c.onpointerup=c.onpointercancel=()=>pen=false}function clearPaper(){drawing=[];repaint()}function undo(){drawing.pop();repaint()}function changeModel(){$('sample').textContent=$('model').value;clearPaper()}
