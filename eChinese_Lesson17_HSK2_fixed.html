span></header><main id="main"></main><section id="report"></section><script>const D=[{"id": 1, "title": "担心今天的听写", "ru": "Перед диктантом: как справиться с волнением", "vocab": [{"zh": "起来", "ru": "вставать", "example": "快点起来吧", "py": "qǐ lái"}, {"zh": "紧张", "ru": "нервничать; напряжённый", "example": "因为太紧张了", "py": "jǐn zhāng"}, {"zh": "睡着", "ru": "заснуть", "example": "一晚上都睡不着", "py": "shuì zháo"}, {"zh": "感觉", "ru": "чувствовать; ощущение", "example": "现在感觉好累", "py": "gǎn jué"}, {"zh": "听见", "ru": "услышать", "example": "听见没", "py": "tīng jiàn"}, {"zh": "洗", "ru": "мыть", "example": "去洗个脸", "py": "xǐ"}, {"zh": "担心", "ru": "беспокоиться", "example": "担心今天的听写", "py": "dān xīn"}, {"zh": "听写", "ru": "диктант", "example": "今天的听写", "py": "tīng xiě"}, {"zh": "记住", "ru": "запомнить", "example": "我都记不住", "py": "jì zhù"}, {"zh": "成绩", "ru": "оценки; результат", "example": "担心成绩", "py": "chéng jì"}, {"zh": "白天", "ru": "днём; дневное время", "example": "白天好好复习", "py": "bái tiān"}, {"zh": "天", "ru": "день; небо", "example": "最近这几天", "py": "tiān"}, {"zh": "复习", "ru": "повторять изученное", "example": "一直在复习", "py": "fù xí"}, {"zh": "半夜", "ru": "полночь; глубокая ночь", "example": "大半夜学生词", "py": "bàn yè"}, {"zh": "有用", "ru": "полезный", "example": "学生词有用吗", "py": "yǒu yòng"}, {"zh": "听到", "ru": "услышать", "example": "听到同学说", "py": "tīng dào"}, {"zh": "字典", "ru": "словарь иероглифов", "example": "用字典", "py": "zì diǎn"}, {"zh": "严", "ru": "строгий", "example": "考试很严", "py": "yán"}, {"zh": "考生", "ru": "экзаменующийся", "example": "不让考生带字典", "py": "kǎo shēng"}, {"zh": "放心", "ru": "успокоиться", "example": "你放心吧", "py": "fàng xīn"}, {"zh": "别人", "ru": "другие люди", "example": "不用听别人的", "py": "bié rén"}, {"zh": "相信", "ru": "верить", "example": "相信自己", "py": "xiāng xìn"}, {"zh": "知识", "ru": "знания", "example": "学习的知识", "py": "zhī shi"}, {"zh": "不要紧", "ru": "ничего страшного", "example": "不要紧", "py": "bú yào jǐn"}, {"zh": "得", "ru": "получить", "example": "得高分", "py": "dé"}, {"zh": "高分", "ru": "высокая оценка", "example": "你一定能得高分", "py": "gāo fēn"}, {"zh": "晚", "ru": "поздний; поздно", "example": "已经太晚了", "py": "wǎn"}, {"zh": "想象", "ru": "представлять", "example": "比你想象的更简单", "py": "xiǎng xiàng"}, {"zh": "收拾", "ru": "привести в порядок", "example": "收拾收拾", "py": "shōu shí"}, {"zh": "简单", "ru": "простой", "example": "更简单", "py": "jiǎn dān"}], "dialog": "伊万：快快，起来！你怎么还在睡呢？快要迟到了。\n玛丽：我没睡好。我昨天晚上因为太紧张了，一晚上都睡不着。现在感觉好累。\n伊万：玛丽，快八点了，听见没？快点起床吧，去洗个脸，收拾收拾。昨天干嘛那么紧张？\n玛丽：我从昨晚开始担心我们今天的听写，有这么多词我都记不住。\n伊万：你如果真的担心成绩，那应该白天好好复习。大半夜学生词有用吗？\n玛丽：我最近这几天一直在复习，都复习完了，可是昨天听到同学说听写还会有一些新学的生词。也不知道我们可不可以用字典？\n伊万：听说今年考试很严，不让考生带字典。你放心吧，不用听别人的。你要相信自己和你学习的知识。别担心，你一定能得高分。\n玛丽：现在说什么都已经太晚了。\n伊万：听我的，不要紧，听写有可能比你想象的更简单。", "tf": [["玛丽快迟到了。", true], ["玛丽因为玩游戏，所以睡得晚。", false], ["伊万相信玛丽一定得高分。", true]], "questions": ["玛丽为什么没睡好？", "伊万认为如果担心考试考不好应该怎么办？", "玛丽为什么担心听写？"], "answers": ["因为有听写，所以玛丽很紧张，一晚上都睡不着。", "应该白天好好复习，不应该大半夜学生词。", "听写可能有一些新学的生词，她记不住，也不知道能不能用字典。"], "components": [["目", "垂", "睡"], ["口", "斤", "听"], ["讠", "只", "识"], ["纟", "责", "绩"], ["日", "免", "晚"]], "phrases": [{"zh": "你怎么还在睡呢？", "ru": "Почему ты всё ещё спишь?", "py": "nǐ zěn me hái zài shuì ne ？"}, {"zh": "快点起来吧。", "ru": "Скорее вставай.", "py": "kuài diǎn qǐ lái ba 。"}, {"zh": "我没睡好。", "ru": "Я плохо спал.", "py": "wǒ méi shuì hǎo 。"}, {"zh": "一晚上都睡不着。", "ru": "Всю ночь не мог заснуть.", "py": "yī wǎn shàng dōu shuì bu zháo 。"}, {"zh": "我有点儿担心今天的听写。", "ru": "Я немного переживаю из-за сегодняшнего диктанта.", "py": "wǒ yǒu diǎn ér dān xīn jīn tiān de tīng xiě 。"}, {"zh": "有这么多词我都记不住。", "ru": "Столько слов, и я не могу их запомнить.", "py": "yǒu zhè me duō cí wǒ dōu jì bú zhù 。"}, {"zh": "那应该白天好好复习。", "ru": "Тогда следует как следует повторять днём.", "py": "nà yīng gāi bái tiān hǎo hāo fù xí 。"}, {"zh": "你放心吧。", "ru": "Не волнуйся.", "py": "nǐ fàng xīn ba 。"}, {"zh": "你要相信自己和你学习的知识。", "ru": "Нужно верить в себя и свои знания.", "py": "nǐ yào xiāng xìn zì jǐ hé nǐ xué xí de zhī shi 。"}, {"zh": "别担心，你一定能得高分。", "ru": "Не переживай, ты обязательно получишь высокий балл.", "py": "bié dān xīn ， nǐ yí dìng néng dé gāo fēn 。"}, {"zh": "听我的，不要紧。", "ru": "Послушай меня, ничего страшного.", "py": "tīng wǒ de ， bú yào jǐn 。"}, {"zh": "听写有可能比你想象的更简单。", "ru": "Возможно, диктант проще, чем ты представляешь.", "py": "tīng xiě yǒu kě néng bǐ nǐ xiǎng xiàng de gèng jiǎn dān 。"}], "warmupQuestions": ["你最近一次考试是什么时候？", "考试前你会紧张吗？", "你一般怎么复习生词？"], "speaking": "Друг не выспался и боится диктанта. Узнайте причину, поддержите его и предложите три конкретных шага подготовки.", "ruleDefs": [{"title": "睡：спать, выспаться, заснуть", "icon": "😴", "formula": "睡觉 · 睡好 · 睡着 · 睡得好", "steps": ["睡觉 — сочетание глагола и объекта: 睡个好觉, 睡午觉. Для результата используем 睡 + 好 / 着.", "好 показывает качество результата: 睡好了 — выспался. 着 читается zháo: 睡着了 — заснул.", "Оценка действия вводится через 得: 睡得很好. Возможность заснуть: 睡得着 / 睡不着. Не путайте 睡不着 и 没睡着."], "examples": ["我没睡好。", "我睡得不好，一晚上都睡不着。", "我没睡，我正在工作呢。", "因为作业很多，这位男生三点才去睡，只睡了四个小时。", "睡好了没？— 是啊，昨晚睡得很舒服。"], "tokens": ["睡", "好", "着", "得", "不", "没"]}, {"title": "紧张、着急、担心：три вида волнения", "icon": "💭", "formula": "紧张 = напряжение · 着急 = спешка · 担心 = беспокойство за…", "steps": ["紧张 описывает напряжение перед испытанием. Может быть сказуемым или определением. 时间紧张 означает, что времени мало.", "着急 связано с нетерпением, спешкой или срочной необходимостью. Сочетается с 别、很 и 着急用.", "担心 обычно указывает причину или объект тревоги: 担心 + человек / событие / целая ситуация."], "examples": ["你干嘛那么紧张？", "考试的时候所有的学生都有些紧张。", "还有几天这个项目就要结束了，时间特别紧张。", "马上要迟到了，我很着急。", "麻烦你帮我找找手机，我很着急用。", "你别着急，慢慢来。", "看他着急的样子，应该出了什么事情。", "我有点担心今天的听写。", "同学们真的很担心他们的成绩。", "我担心妈妈会知道这件事。"], "tokens": ["紧张", "着急", "担心"]}, {"title": "记、记得、记住：записать, помнить, запомнить", "icon": "📝", "formula": "记 = записывать · 记得 = помнить · 记住 = запомнить", "steps": ["记 означает сделать запись или зафиксировать сведения: 记在 + место; 记一下.", "记得 — состояние памяти: помню, что… Отрицание: 不记得. 记住 — достигнутый результ function key(i,j){return i+':'+j}function norm(s){return String(s??'').normalize('NFC').replace(/[\s，。！？、,.!?；;：:]/g,'')}function score(i){let s=sections[i];return s.qs.reduce((a,x,j)=>a+(x.oral?Number(state[key(i,j)+'m']||0):Number(!!state[key(i,j)]&&norm(state[key(i,j)])===norm(x.answer))),0)}function max(i){return sections[i].qs.reduce((a,x)=>a+(x.oral?2:1),0)}function go(p){page=p;render();window.scrollTo(0,0)}function choose(i,j,v){if(locked[i])return;state[key(i,j)]=v;document.querySelectorAll('[data-q="'+j+'"]').forEach(b=>b.classList.toggle('active',b.dataset.val===v))}function check(){locked[page-1]=true;render()}function render(){let m=$('main');let nav='<nav>'+sections.map((s,i)=>'<button class="'+(page===i+1?'active':'')+'" onclick="go('+(i+1)+')">'+(i+1)+' '+(locked[i]?'✓':'')+'</button>').join('')+'<button onclick="go(0)">⌂</button><button onclick="go('+ (sections.length+1)+')">Итоги</button></nav>';if(page===0){m.innerHTML='<div class="hero"><small>复习 · УРОК 17</small><h1>学习的小麻烦</h1><h2>Большое повторение</h2><p>HSK 2 · 90 слов · 3 части · 18 основных заданий + общий квиз, чтение, порядок слов и говорение.</p><label>Имя ученика<input type="text" id="student" value="'+esc(name)+'" oninput="name=this.value"></label><button class="active" onclick="go(1)">Начать →</button></div>'+nav;return}if(page>sections.length){m.innerHTML='<h1>Итоги · 成绩</h1>'+summary()+'<button onclick="pdf()">Сохранить PDF</button> <button onclick="send()">Отправить учителю</button><p class="muted">Сначала сохраните PDF, затем прикрепите его к письму вручную. Баллы говорения выставляет преподаватель.</p>'+nav;return}let i=page-1,s=sections[i];m.innerHTML=nav+'<h2>'+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p><p>'+s.qs.length+' вопросов'+(locked[i]?' · '+score(i)+' / '+max(i):'')+'</p>'+s.qs.map((x,j)=>{let k=key(i,j),v=state[k]||'',done=locked[i],ok=norm(v)===norm(x.answer)&&v!=='';return '<div class="q '+(done&&!x.oral?(ok?'good':'bad'):'')+'">'+(x.passage?'<details><summary>Текст</summary><p class="zh">'+esc(x.passage).replace(/\n/g,'<br>')+'</p><p class="py">'+esc(x.passpy)+'</p></details>':'')+'<small>№ '+(j+1)+'</small><div class="zh">'+esc(x.prompt)+'</div>'+(x.required?'<p>'+esc(x.required)+'</p>':'')+(x.py?'<div class="py">'+esc(x.py)+'</div>':'')+(x.ru?'<div class="ru">'+esc(x.ru)+'</div>':'')+(x.options.length?'<div class="opts">'+x.options.map(o=>'<button data-q="'+j+'" data-val="'+esc(o)+'" class="'+(v===o?'active':'')+'" '+(done?'disabled':'')+' onclick="choose('+i+','+j+',this.dataset.val)">'+esc(o)+'</button>').join('')+'</div>':'<textarea '+(done&&!x.oral?'disabled':'')+' oninput="state[\''+k+'\']=this.value" placeholder="Ваш ответ">'+esc(v)+'</textarea>')+(x.draw?'<canvas width="120" height="120" data-draw="'+k+'"></canvas><button onclick="clearCanvas(this.previousElementSibling)">Очистить клетку</button>':'')+(x.oral?'<label>Оценка учителя <select onchange="state[\''+k+'m\']=this.value"><option value="0">0 / 2</option><option value="1" '+(state[k+'m']==1?'selected':'')+'>1 / 2</option><option value="2" '+(state[k+'m']==2?'selected':'')+'>2 / 2</option></select></label>':'')+(done&&!x.oral?'<p>Ответ: '+esc(x.answer)+'</p>':'')+'</div>'}).join('')+'<nav><button onclick="go('+ (page-1)+')">← Назад</button><button class="active" onclick="check()">Завершить и проверить</button><button onclick="go('+(page+1)+')">Далее →</button></nav>';document.querySelectorAll('canvas').forEach(c=>{let ctx=c.getContext('2d'),k=c.dataset.draw;ctx.lineWidth=5;ctx.lineCap='round';if(state[k+'draw']){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=state[k+'draw']}let drawing=false;function pt(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pt(e))};c.onpointermove=e=>{if(drawing){ctx.lineTo(...pt(e));ctx.stroke()}};c.onpointerup=()=>{drawing=false;state[k+'draw']=c.toDataURL()}})}function clearCanvas(c){c.getContext('2d').clearRect(0,0,c.width,c.height);delete state[c.dataset.draw+'draw']}function summary(){let a=sections.reduce((n,s,i)=>n+score(i),0),b=sections.reduce((n,s,i)=>n+max(i),0);return '<p>Ученик: '+esc(name||'—')+'</p><h2>'+a+' / '+b+' · '+Math.round(a/b*100)+'%</h2><table><tr><th>Задание</th><th>Баллы</th><th>Статус</th></tr>'+sections.map((s,i)=>'<tr><td>'+esc(s.title)+'</td><td>'+score(i)+' / '+max(i)+'</td><td>'+(locked[i]?'Проверено':'Не завершено')+'</td></tr>').join('')+'</table>'}function pdf(){$('report').innerHTML='<h1>eChinese · Урок 17</h1>'+summary()+sections.map((s,i)=>'<h3>'+esc(s.title)+'</h3>'+s.qs.map((x,j)=>'<p>'+esc(x.prompt)+' — '+esc(state[key(i,j)]||'—')+(x.oral?' · оценка '+(state[key(i,j)+'m']||0):' · ключ: '+esc(x.answer))+'</p>').join('')).join('');window.print()}function send(){location.href='mailto:?subject='+encodeURIComponent('eChinese — результаты урока 17')+'&body='+encodeURIComponent('Ученик: '+name+'\n'+sections.map((s,i)=>s.title+': '+score(i)+'/'+max(i)).join('\n')+'\nPDF прикрепляется вручную.')}function resetAll(){if(confirm('Удалить все ответы и перемешать задания?')){state={};locked={};start=Date.now();build();go(0)}}setInterval(()=>{let t=Math.floor((Date.now()-start)/1000);$('clock').textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')},1000);build();render();</script></html>
