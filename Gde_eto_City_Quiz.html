const places=['奥林匹克公园','动物园','歌剧院','博物馆','中国城','商店','饭馆'];
const layouts=[[0,1,2,3,4,5,6,-1],[4,3,0,5,1,-1,6,2],[2,6,-1,1,3,0,5,4],[5,4,1,-1,0,2,3,6],[-1,0,6,4,2,1,3,5]];
const rounds=[[1,5,'对面'],[3,0,'左边'],[4,5,'右边'],[3,1,'对面'],[6,0,'右边']];
const relations={左边:'слева',右边:'справа',对面:'напротив'};
const $=id=>document.getElementById(id);
let i=0;
const fresh=()=>rounds.map(()=>({wrong:new Set(),solved:false}));
let progress=fresh();
function show(){
 const state=progress[i];
 const [a,b,correct]=rounds[i];
 $('map').src=images[i];
 $('map').alt='Карта '+(i+1)+'. Верхний ряд слева направо: '+layouts[i].slice(0,4).map(k=>places[k]??'сквер').join(', ')+'. Нижний ряд: '+layouts[i].slice(4).map(k=>places[k]??'сквер').join(', ');
 $('count').textContent='Карта '+(i+1)+' из '+rounds.length;
 $('question').textContent=places[a]+'在哪儿？';
 $('answers').replaceChildren();
 $('status').textContent=state.solved?'Верно! '+correct+' — '+relations[correct]+'.':'';
 $('prev').disabled=i===0;
 $('next').disabled=false;
 $('next').textContent=i===rounds.length-1?'Показать результат →':'Следующая карта →';
 const choices=Object.keys(relations);
 for(let j=choices.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[choices[j],choices[k]]=[choices[k],choices[j]]}
 for(const relation of choices){
  const btn=document.createElement('button');btn.textContent=places[a]+'在'+places[b]+'的'+relation+'。';
  if(state.wrong.has(relation))btn.classList.add('no');
  if(state.solved&&relation===correct)btn.classList.add('yes');
  btn.disabled=state.solved||state.wrong.has(relation);
  btn.onclick=()=>{
   if(relation!==correct){state.wrong.add(relation);btn.classList.add('no');btn.disabled=true;$('status').textContent='Посмотри ещё раз на расположение этих двух мест.';return}
   state.solved=true;
   btn.classList.add('yes');for(const option of $('answers').children)option.disabled=true;
   $('status').textContent='Верно! '+correct+' — '+relations[correct]+'.';

  };$('answers').append(btn);
 }
}
$('prev').onclick=()=>{if(i>0){i--;show()}};
$('next').onclick=()=>{
 if(i>=rounds.length)return;
 i++;
 if(i<rounds.length){show();return}
 const solved=progress.filter(state=>state.solved).length;
 const first=progress.filter(state=>state.solved&&!state.wrong.size).length;
 $('count').textContent='Решено '+solved+' из '+rounds.length;
 $('question').textContent='Результат';
 $('answers').replaceChildren();
 $('status').textContent='Верно с первого раза: '+first+' из '+rounds.length+'.';
 $('next').disabled=true;
};
$('reset').onclick=()=>{i=0;progress=fresh();show()};
$('full').onclick=async()=>{
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}
 catch{$('full').textContent='Полный экран недоступен'}
};
document.addEventListener('fullscreenchange',()=>{
 $('full').textContent=document.fullscreenElement?'Выйти из полного экрана':'На весь экран';
});
show();
