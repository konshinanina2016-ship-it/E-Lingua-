<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Часы дракончика · E-LINGUA</title>
<style>
:root{--ink:#193e36;--green:#216d60;--mint:#e5f3ea;--plum:#654781;--lav:#eee5f8;--peach:#ffdccb;--cream:#fcf6ec;--line:#e9dccb}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 90% 65%,#f0e6f8,transparent 55%),var(--cream);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
main{max-width:1170px;padding:18px 22px 32px;margin:auto}
button,select{font:inherit}
button,select{border:1px solid var(--line);border-radius:13px;background:#fffaf4;color:var(--ink);min-height:44px;padding:8px 13px}
button{cursor:pointer;font-weight:700}
button:hover:not(:disabled){box-shadow:inset 0 0 0 2px #216d6055}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #99580b;outline-offset:3px}
.bar,.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.bar{justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:.13em;font-size:.85rem}
.mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--mint);border:1px solid #bdd9ca;font-size:1.15rem;letter-spacing:0}
.hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#fcf6ec;min-height:235px;display:grid;grid-template-columns:1.2fr 1fr;align-items:center}
.hero img{width:100%;height:100%;position:absolute;right:0;top:0;object-fit:contain;object-position:right center;width:52%;z-index:-1}
.heroText{grid-column:1;padding:24px 0 24px 30px}
.kicker{color:var(--green);font-weight:850;letter-spacing:.12em;font-size:.77rem;margin:0 0 4px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.04;letter-spacing:-.045em;margin:6px 0 8px}
.sub{font-size:clamp(.9rem,2vw,1.15rem)}
.badge{display:inline-block;border-radius:40px;padding:3px 10px;background:var(--lav);color:var(--plum);font-size:.79rem;font-weight:800;margin-top:10px}
nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
nav button[aria-pressed=true],.primary{background:var(--green);color:white;border-color:var(--green)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:23px;padding:clamp(14px,3vw,25px);box-shadow:0 7px 26px #5538180a;min-width:0}
.clockCard{text-align:center}
.clockCard svg{width:min(100%,390px);height:auto;display:block;margin:auto;user-select:none;overflow:visible}
.clockCard .row{justify-content:center}
.legend{display:flex;justify-content:center;gap:13px;font-size:.85rem;margin:5px 0 10px}
.legend span::before{content:'';display:inline-block;width:.68em;height:.68em;border-radius:50%;margin-right:5px;background:var(--green)}
.legend span+span::before{background:#a05fbd}
.hand{cursor:grab;touch-action:none}.hand:active{cursor:grabbing}
.hand[aria-disabled=true]{cursor:default}
.hit{stroke:transparent;stroke-width:25}
.num{font-size:19px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.digi{display:inline-block;background:var(--mint);font-size:1.38rem;font-weight:850;font-variant-numeric:tabular-nums;padding:1px 13px;border-radius:9px;margin:7px 0}
.muted{color:#46645c;font-size:.91rem;margin:7px 0 10px}
.label{font-size:.79rem;letter-spacing:.09em;font-weight:850;text-transform:uppercase;color:var(--plum)}
.taskbox{padding:16px;background:var(--lav);border-radius:16px;margin:13px 0;min-height:105px;overflow-wrap:anywhere}
.zh{display:block;font-size:clamp(1.55rem,4vw,2.45rem);font-weight:800;line-height:1.25}
.py{display:block;color:var(--plum);margin:4px 0;font-weight:650}
.no-py .py{visibility:hidden}
.feedback{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--mint);font-weight:650}
.feedback:empty{display:none}
.feedback[data-kind=retry]{background:var(--peach)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.choice{padding:10px 5px;font-size:1.13rem;overflow-wrap:anywhere}
.choice .py{font-size:.83rem}
.choice.good{background:#d1eddb;border-color:#8bb99a}.choice.bad{background:var(--peach);border-color:#da957e}
.tools{margin-top:12px}
.score{padding:4px 10px;background:#f9e7bf;border-radius:30px;font-size:.88rem;font-weight:800}
.panelTop{justify-content:space-between;align-items:flex-start}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin:12px 0 20px}
.word{border-radius:14px;background:var(--mint);padding:11px 14px}
.word:nth-child(3n+2){background:var(--lav)}.word:nth-child(3n){background:var(--peach)}
.word b{font-size:1.33rem}
footer{text-align:center;color:#46645c;font-size:.85rem;margin-top:16px}
[hidden]{display:none!important}
@media(max-width:720px){main{padding:10px 10px 24px}.grid{grid-template-columns:1fr}.hero{min-height:156px;grid-template-columns:1.27fr 1fr}.heroText{padding:13px 0 13px 14px}.hero img{width:48%;object-fit:cover}.bar button{font-size:.8rem;padding:6px 8px}.bar{gap:5px}nav{margin:10px 0}nav button{flex:1 1 auto;font-size:.88rem;padding:7px 8px}.clockCard svg{width:min(77vw,340px)}.grid.game #exercise{grid-row:1}}
@media print{.bar button,nav,button,select,footer{display:none!important}body{background:white}.grid{grid-template-columns:1fr 1fr}.card{box-shadow:none}.hero{min-height:160px}}
</style>
</head>

const numbers = ['零','一','二','三','四','五','六','七','八','九','十'];
const syllables = ['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ','shí'];

const hourOf = t => Math.floor(t / 60) || 12;
const digital = t => String(hourOf(t)).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
function numeral(n, list, sep = '') {
  if (n <= 10) return list[n];
  const tens = Math.floor(n / 10), units = n % 10;
  return [tens === 1 ? '' : list[tens],list[10],units ? list[units] : ''].filter(Boolean).join(sep);
}
function phrase(t, style = 'common') {
  const h = hourOf(t), m = t % 60;

  if (style === 'common' && special[m]) return [hz + '点' + special[m][0],hp + ' diǎn ' + special[m][1]];
  const pad = m < 10;
  return [hz + '点' + (pad ? '零' : '') + numeral(m,numbers) + '分',
    hp + ' diǎn ' + (pad ? 'líng ' : '') + numeral(m,syllables,'') + ' fēn'];
}
function formatted([zh,py]) {

}

for (let i=0;i<60;i++) {
  const tick = document.createElementNS(svgNS,'line');
  Object.entries({x1:170,x2:170,y1:26,y2:i%5 ? 32 : 38,stroke:i%5 ? '#c2ae96' : '#659788','stroke-width':i%5 ? 1 : 3,'stroke-linecap':'round',transform:'rotate('+ i*6 +' 170 170)'}).forEach(([k,v])=>tick.setAttribute(k,v));
  $('dial').append(tick);
}
for (let i=1;i<=12;i++) {
  const n = document.createElementNS(svgNS,'text');
  const a = i*Math.PI/6;
  n.setAttribute('x',170+117*Math.sin(a));
  n.setAttribute('y',170-117*Math.cos(a));
  n.setAttribute('class','num');
  n.textContent = i;
  $('dial').append(n);
}
function canMove() { return (state.mode === 'practice' || state.mode === 'set') && !state.won; }
function drawClock() {
  const t = state.time;
  hands[0].setAttribute('transform','rotate('+ t/2 +' 170 170)');
  hands[1].setAttribute('transform','rotate('+ (t%60)*6 +' 170 170)');
  hands[0].setAttribute('aria-valuenow',hourOf(t));
  hands[1].setAttribute('aria-valuenow',t%60);
  $('digital').textContent = digital(t);
}
function setTime(t) {
  state.time = wrap(t);
  drawClock();
  if (state.mode === 'practice') renderPrompt();
  if (state.mode === 'set' && !state.won) feedback('');
}
function pointerAngle(e) {
  const p = clock.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const pt = p.matrixTransform(clock.getScreenCTM().inverse());
  if (Math.hypot(pt.x-170,pt.y-170)<20) return null;
  return (Math.atan2(pt.x-170,170-pt.y)*180/Math.PI+360)%360;
}
let drag = null;
hands.forEach((hand,index)=>{
  hand.addEventListener('pointerdown', e=>{
    if (!canMove() || drag || e.button !== 0) return;
    const angle = pointerAngle(e);
    if (angle === null) return;
    e.preventDefault();
    hand.setPointerCapture(e.pointerId);
    drag = {id:e.pointerId,angle,total:0,time:state.time};
  });
  hand.addEventListener('pointermove', e=>{
    if (!drag || drag.id !== e.pointerId || !canMove()) return;
    const angle = pointerAngle(e);
    if (angle === null) return;
    drag.total += (angle-drag.angle+540)%360-180;
    drag.angle = angle;
    const step = index ? 1 : 60;
    const degrees = index ? 6 : 30;
    setTime(drag.time + step*Math.round(drag.total/degrees));
  });
  for (const event of ['pointerup','pointercancel','lostpointercapture']) {
    hand.addEventListener(event,e=>{ if (drag?.id === e.pointerId) drag = null; });
  }
  hand.addEventListener('keydown', e=>{
    if (!canMove()) return;
    const dir = {ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key];
    if (!dir) return;
    e.preventDefault();
    setTime(state.time + dir*(index ? 1 : 60));
  });
});
document.querySelectorAll('[data-delta]').forEach(btn=>btn.onclick=()=>{
  if (canMove()) setTime(state.time+Number(btn.dataset.delta));
});
function shuffle(items) {
  const result = [...items];
  for (let i=result.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [result[i],result[j]] = [result[j],result[i]];
  }
  return result;
}
function pool() {
  const step = {basic:30,five:5,all:1}[$('level').value];
  return Array.from({length:720/step},(_,i)=>i*step);
}
function options(t) {
  const level = $('level').value;
  const offset = level === 'basic' ? 30 : level === 'five' ? 5 : 1;
  const sameHour = Math.floor(t/60)*60 + (t%60+offset)%60;
  const wrong = [sameHour,wrap(t+60),wrap(sameHour+60)];
  return shuffle([t,...wrong]);
}
function feedback(message,kind='') {
  $('feedback').textContent = message;
  $('feedback').dataset.kind = kind;
}
function renderPrompt() {
  const {mode,time,target,show,hint} = state;
  const t = mode === 'practice' ? time : target;
  const answer = phrase(t);
  if (mode === 'practice' || mode === 'set' || mode === 'decode') {
    $('prompt').innerHTML = show ? formatted(answer) : '<strong>Фраза скрыта</strong><p>Нажми «Показать фразу», чтобы открыть время.</p>';
  } else {
    $('prompt').innerHTML = show ? formatted(answer) : '<strong lang="zh-Hans">现在几点？</strong><p>Который час?</p>';
  }
  $('reveal').textContent = show ? 'Скрыть фразу' : 'Показать фразу';
  $('hint').setAttribute('aria-expanded',hint);
  $('hint').textContent = hint ? 'Скрыть подсказку' : '💡 Подсказка';
  $('tip').hidden = !hint;
  if (hint) {
    const m = t%60;
    const rule = m===30 ? '半 — половина часа.' : m===15 ? '一刻 — четверть часа.' : m===45 ? '三刻 — три четверти часа.' : m===0 ? '点 — столько-то часов.' : '分 — минуты.';
    const details = mode === 'read' ? 'Короткая стрелка показывает час, длинная — минуты. От цифры к цифре проходит 5 минут. ' :
      mode === 'set' || mode === 'decode' ? 'Число перед 点 обозначает часы. ' :
      'По-русски: ' + digital(t) + '. ';
    $('tip').textContent = details + rule + (hourOf(t)===2 ? ' Для двух часов говорим 两点.' : '');
  }
}
function render() {
  const {mode,correct,won} = state;
  const practice = mode === 'practice', set = mode === 'set', read = mode === 'read', decode = mode === 'decode';
  const words = mode === 'words';
  $('dictionary').hidden = !words;
  $('gameGrid').hidden = words;
  $('gameGrid').classList.toggle('game',set);
  $('gameGrid').style.gridTemplateColumns = decode ? 'minmax(0,1fr)' : '';
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.setAttribute('aria-pressed',btn.dataset.mode===mode));
  if (words) return;
  const [label,title,instructions] = modeInfo[mode];
  $('modeLabel').textContent = label;
  $('title').textContent = title;
  $('instructions').textContent = instructions;
  $('clockCard').hidden = decode;
  $('digital').hidden = read && !won;
  $('adjust').hidden = !practice && !set;
  $('adjust').querySelectorAll('button').forEach(btn=>btn.disabled = !canMove());
  hands.forEach(hand=>{
    hand.setAttribute('aria-disabled',!canMove());
    hand.setAttribute('tabindex',canMove() ? '0' : '-1');
  });
  $('score').hidden = practice;
  $('score').textContent = '⭐ Решено: ' + correct;
  $('check').hidden = !set;
  $('check').disabled = won;
  $('next').textContent = practice ? '🎲 Случайное время' : won ? 'Следующее задание' : 'Другое задание';
  $('reveal').hidden = !practice && !won && (set || read || decode);
  $('choices').hidden = !read && !decode;
  drawClock();
  renderPrompt();
}
function renderChoices() {
  $('choices').replaceChildren();
  if (state.mode !== 'read' && state.mode !== 'decode') return;
  for (const time of state.choices) {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (state.mode === 'read') {
      const [zh,py] = phrase(time);
      btn.innerHTML = '<span lang="zh-Hans">'+zh+'</span><span class="py" lang="zh-Latn">'+py+'</span>';
    } else btn.textContent = digital(time);
    btn.onclick = ()=>{
      if (time === state.target) {
        btn.classList.add('good');
        $('choices').querySelectorAll('button').forEach(choice=>choice.disabled = true);
        success();
        $('next').focus();
      } else {
        btn.classList.add('bad');
        btn.disabled = true;
        feedback('Пока мимо. Попробуй другой вариант.','retry');
        $('choices').querySelector('button:not(:disabled)')?.focus();
      }
    };
    $('choices').append(btn);
  }
}
function success() {
  if (state.won) return;
  state.won = true;
  state.correct++;
  state.show = true;
  render();
  feedback('对了！ Верно! На часах ' + digital(state.target) + '.');
}
function newRound(initial=false) {
  const practice = state.mode === 'practice';
  const candidates = pool().filter(t=>t!==state.target);
  state.target = initial && practice ? 495 : candidates[Math.floor(Math.random()*candidates.length)];
  state.time = state.mode === 'set' ? (state.target === 0 ? 60 : 0) : state.target;
  state.won = false;
  state.show = practice ? (initial || state.show) : state.mode !== 'read';
  state.hint = false;
  state.choices = options(state.target);
  feedback('');
  renderChoices();
  render();
}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{
  if (state.mode === btn.dataset.mode) return;
  state.mode = btn.dataset.mode;
  state.correct = 0;
  if (state.mode === 'words') render();
  else newRound(true);
});
$('next').onclick = ()=>newRound();
$('level').onchange = ()=>newRound();
$('check').onclick = ()=>{
  if (state.time === state.target) {success();$('next').focus();}
  else {
    const t = state.target, v = state.time;
    const msg = hourOf(t) === hourOf(v) ? 'Час выставлен верно. Проверь минуты.' :
      t%60 === v%60 ? 'Минуты выставлены верно. Проверь час.' : 'Проверь обе стрелки и попробуй ещё раз.';
    feedback(msg,'retry');
  }
};
$('reveal').onclick = ()=>{state.show = !state.show;renderPrompt();};
$('hint').onclick = ()=>{state.hint = !state.hint;renderPrompt();};
$('reset').onclick = ()=>{state.correct = 0;newRound(true);};
$('pinyin').onclick = ()=>{
  const hidden = document.body.classList.toggle('no-py');
  $('pinyin').setAttribute('aria-pressed',hidden);
  $('pinyin').textContent = hidden ? 'Показать пиньинь' : 'Скрыть пиньинь';
};
$('print').onclick = ()=>window.print();
$('fullscreen').onclick = async ()=>{
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else feedback('Для полноэкранного просмотра воспользуйся меню браузера.');
  } catch { feedback('Для полноэкранного просмотра воспользуйся меню браузера.'); }
};
document.addEventListener('fullscreenchange',()=>{
  $('fullscreen').textContent = document.fullscreenElement ? '⛶ Выйти из полного экрана' : '⛶ На весь экран';
});
const vocabulary = [
  ['现在','xiànzài','сейчас'],['几点？','jǐ diǎn?','который час?'],['点','diǎn','час в указании времени'],
  ['分','fēn','минута'],['半','bàn','половина часа'],['刻','kè','четверть часа'],
  ['零','líng','ноль перед минутами от 01 до 09'],['两点','liǎng diǎn','два часа'],
  ['差','chà','не хватает, без (стольких-то минут)'],['时针','shízhēn','часовая стрелка'],['分针','fēnzhēn','минутная стрелка'],
  ['早上','zǎoshang','рано утром'],['上午','shàngwǔ','до полудня'],['中午','zhōngwǔ','около полудня'],
  ['下午','xiàwǔ','после полудня'],['晚上','wǎnshang','вечером']
];
const examples = [
  ['现在几点？','Xiànzài jǐ diǎn?','Который сейчас час?'],
  [...phrase(120),'02:00 · два часа'],[...phrase(127),'02:07 · два часа семь минут'],
  [...phrase(195),'03:15 · четверть четвёртого'],[...phrase(270),'04:30 · половина пятого'],
  [...phrase(345),'05:45 · пять сорок пять'],[...phrase(345,'numeric'),'05:45 · вариант с минутами'],
  ['差五分六点','chà wǔ fēn liù diǎn','05:55 · без пяти шесть'],
  ['下午三点','xiàwǔ sān diǎn','15:00 · три часа дня']
];
for (const [id,items] of [['words',vocabulary],['examples',examples]]) {
  $(id).innerHTML = items.map(([zh,py,ru])=>'<div class="word"><b lang="zh-Hans">'+zh+'</b><span class="py" lang="zh-Latn">'+py+'</span><span>'+ru+'</span></div>').join('');
}
newRound(true);
</script>
