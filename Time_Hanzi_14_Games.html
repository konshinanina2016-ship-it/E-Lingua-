function home(){stopClock();runToken++;session=null;screen='home';setColors();$('#main').innerHTML=`<section class="hero"><div><div class="eyebrow">贯通中文 综合教程 1 · Урок 4</div><h1>Иероглифы<br><em>в игре</em></h1><p>时间与安排 · Время и планы<br>Смотри внимательно, собирай, сравнивай и пиши. Здесь каждая черта имеет значение.</p></div><div class="hero-art" aria-hidden="true"><div class="hero-tile">点</div><div class="hero-tile">半</div><small>汉字工坊</small></div></section><section class="settings" aria-label="Настройки игр"><label>Имя <input id="playerName" type="text" placeholder="По желанию" value="${escapeHtml(profile.settings.name)}" maxlength="40"></label><label>Заданий <select id="roundLength">${[6,8,10].map(n=>`<option ${n===+profile.settings.length?'selected':''}>${n}</option>`).join('')}</select></label><label>Таймер <select id="timerSetting">${[[0,'Без таймера'],[120,'2 минуты'],[180,'3 минуты'],[300,'5 минут']].map(([n,l])=>`<option value="${n}" ${+profile.settings.timer===n?'selected':''}>${l}</option>`).join('')}</select></label><label>Банк частей <select id="bankSetting">${[12,16].map(n=>`<option value="${n}" ${(+profile.settings.bank||12)===n?'selected':''}>${n} вариантов</option>`).join('')}</select></label><div class="smart">✦ Умное повторение · Без повторов в раунде</div></section><div class="games">${CFG.map(g=>{let b=profile.games[g.id];return `<button class="game-card" data-start="${g.id}" style="--accent:${g.color};--tint:${g.tint}"><span class="game-number">${String(g.id).padStart(2,'0')}</span><span class="game-icon">${g.icon}</span><span class="game-title">${g.title}</span><span class="game-desc">${g.desc}</span><span class="best">${b?'Лучший результат: '+b.best+'% · Раундов: '+b.rounds:'Открыть игру →'}</span></button>`}).join('')}</div><details><summary>Как меняются задания</summary><p>В каждом раунде знаки выбираются без повторов. Иероглифы, в которых были ошибки, чаще возвращаются в следующих раундах. Недавние знаки чередуются с другими, чтобы была function start(id){stopClock();runToken++;const g=CFG.find(x=>x.id===id);setColors(g);let pool=g.kind==='puzzle'?CH.filter(ch=>C[ch].parts.length):g.kind==='sort'?CH.filter(ch=>C[ch].structureGroup):g.kind==='imagepuzzle'?CH.filter(ch=>C[ch].strokes.length>=6):g.kind==='word'?WORD_KEYS:CH;const n=g.kind==='memory'?Math.min(6,+profile.settings.length):+profile.settings.length;const chosen=weighted(pool,n,id);session={id,chars:chosen,pos:0,score:0,ok:0,bad:0,answered:0,total:chosen.length,streak:0,bestStreak:0,errors:[],locked:false,usedHints:0,timeLeft:+profile.settings.timer,started:Date.now(),ended:false,answers:[],ordinals:shuffle(Array.from({length:chosen.length},(_,i)=>i%2+1)),falseReadingKinds:shuffle(Array.from({length:Math.floor(chosen.length/2)},(_,i)=>i%2)),boolTypes:shuffle(Array.from({length:chosen.length},(_,i)=>i%3)),bools:shuffle(Array.from({length:chosen.length},(_,i)=>i%2===0)),pool,hasAttemptError:false};screen='game';if(g.kind==='memory')initMemory();else if(g.kind==='sort')initSort();else renderQuestion();startClock()}
function shell(title,instruction){const g=cfg();$('#main').innerHTML=`<section class="session-top"><div class="session-name"><span class="badge">${g.icon}</span><div><h2>${g.title}</h2><small>贯通中文 1 · 时间与安排</small></div></div><div class="stats"><span class="stat">Готово <b id="progressCount">${session.answered}/${session.total}</b></span><span class="stat">Баллы <b id="scoreValue">${session.score}</b></span><span class="stat" id="clockStat" ${!profile.settings.timer?'hidden':''}>Время <b id="clockValue"></b></span></div></section><div class="progress"><span id="progressBar" style="width:${session.answered/session.total*100}%"></span></div><section class="arena"><div class="question-head"><div><h2>${title}</h2><p>${instruction}</p></div><span class="question-no">${cfg().kind==='memory'?'Найди '+session.total+' пар':cfg().kind==='sort'?'Распредели '+session.total+' знаков':'Задание '+(session.pos+1)+' из '+session.total}</span></div><div id="playArea"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="q-footer"><button id="dontKnow">${['sort','memory'].includes(cfg().kind)?'Завершить раунд':'Не знаю — покажи'}</button><small>Можно играть без спешки и без таймера</small></div></section>`;$('#dontKnow').onclick=()=>{if(session.locked)return;if(g.kind==='memory'||g.kind==='sort'){finish(true)}else {if(g.kind==='hunt')revealHunt();if(g.kind==='word')$('#wordMissing').textContent=[...session.chars[session.pos]][1];grade(false,'Сначала посмотрите правильный ответ.',true)}};paintStats();window.scrollTo(0,0)}
function paintStats(){if(!session)return;if($('#scoreValue'))$('#scoreValue').textContent=session.score;if($('#progressCount'))$('#progressCount').textContent=session.answered+'/'+session.total;if($('#progressBar'))$('#progressBar').style.width=session.answered/session.total*100+'%';if($('#clockValue'))$('#clockValue').textContent=Math.floor(session.timeLeft/60)+':'+String(session.timeLeft%60).padStart(2,'0')}
function startClock(){if(!session.timeLeft)return;let last=Date.now();clock=setInterval(()=>{if(!session||session.ended)return;let now=Date.now();if(modalOpen){last=now;return}const sec=Math.floor((now-last)/1000);if(sec){session.timeLeft=Math.max(0,session.timeLeft-sec);last+=sec*1000;paintStats();if(!session.timeLeft)finish(true)}},200)}function stopClock(){if(clock)clearInterval(clock);clock=null}
function next(){if(!session||session.ended)return;session.pos++;if(session.pos>=session.total){finish();return}session.locked=false;session.usedHints=0;session.hasAttemptError=false;renderQuestion()}
function scoreOne(ch,ok,points=10){session.answered++;session.answers.push({ch,ok,first:ok&&!session.hasAttemptError});record(ch,ok);if(ok){if(!session.hasAttemptError)session.ok++;session.score+=points;session.streak++;session.bestStreak=Math.max(session.bestStreak,session.streak)}else{session.bad++;session.streak=0;if(!session.errors.includes(ch))session.errors.push(ch)}paintStats()}
function grade(ok,message='',force=false){if(!session||session.locked||session.ended)return;const ch=session.chars[session.pos];session.locked=true;scoreOne(ch,ok,session.usedHints?6:10);if(ok)celebrate();else playSound(false);document.querySelectorAll('#playArea button').forEach(b=>b.disabled=true);const fb=$('#feedback');fb.className='feedback visible'+(ok?'':' bad');fb.innerHTML=`<b>${ok?'Верно! ✦':'Запомним этот знак'}</b><p>${message||''}</p><p><strong>${ch}</strong> · ${C[ch].py} · ${C[ch].meaning}<br>${C[ch].structure}</p><div id="solutionSteps"></div><div class="actionrow"><button id="nextQuestion" class="primary">${session.pos+1===session.total?'Результат →':'Далее →'}</button><button id="studyAnswer">Разобрать знак</button></div>`;if(!C[ch].word&&(!ok||['trace','order','ordinal'].includes(cfg().kind)))$('#solutionSteps').append(strip(ch));$('#nextQuestion').onclick=next;$('#studyAnswer').onclick=()=>study(ch);$('#dontKnow').disabled=true;$('#nextQuestion').focus({preventScroll:true});fb.scrollIntoView({behavior:'auto',block:'nearest'})}
function choiceButtons(values,answer,cls=''){const el=document.createElement('div');el.className='choices';values.forEach(v=>{const b=document.createElement('button');b.className='choice '+cls;b.textContent=v;b.dataset.answer=v;b.onclick=()=>{if(session.locked)return;el.querySelectorAll('button').forEach(x=>x.classList.add(x.textContent===answer?'good':x===b?'bad':'neutral'));grade(v===answer,v===answer?'':'Правильный ответ: '+answer+'.')};el.append(b)});return el}

function reading(ch){shell('Как читается этот иероглиф?','Найдите пиньинь. Обратите внимание и на звуки, и на тон.');$('#playArea').innerHTML='<div class="quiz-layout"><div class="glyph large" id="quizGlyph"></div><div id="answerChoices"></div></div>';putGlyph('#quizGlyph',ch,{colorful:true});let choices=balancedChoices(C[ch].py,similar(ch).slice(0,6).map(x=>C[x].py));$('#answerChoices').append(choiceButtons(choices,C[ch].py,'pinyin'))}
function reveal(ch){const d=C[ch];let shown=Math.max(1,Math.floor(d.strokes.length*.4));session.q.shown=shown;shell('Какой знак прячется за чертами?','Прочитайте подсказку по значению и рассмотрите открытые черты.');$('#playArea').innerHTML=`<div class="quiz-layout"><div><div class="glyph large" id="quizGlyph"></div><div class="small-actions" style="justify-content:center"><button id="revealMore">Открыть ещё черту</button></div></div><div><p class="clue">Значение: <b>${d.meaning}</b></p><div id="answerChoices"></div></div></div>`;putGlyph('#quizGlyph',ch,{count:shown,grid:true});$('#answerChoices').append(choiceButtons(balancedChoices(ch,similar(ch).slice(0,6)),ch));$('#revealMore').onclick=()=>{if(session.q.shown<d.strokes.length){session.q.shown++;session.usedHints++;putGlyph('#quizGlyph',ch,{count:session.q.shown,grid:true});if(session.q.shown===d.strokes.length)$('#revealMore').disabled=true}}}

function strokeWord(n){return n%10===1&&n%100!==11?'черта':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'черты':'черт'}

function countQuestion(ch){session.q.number=null;shell('Сколько черт в иероглифе?','Считайте движения, не отрывая кисть внутри одной сложной черты. Выберите число.');$('#playArea').innerHTML='<div class="quiz-layout"><div class="glyph large" id="quizGlyph"></div><div><div class="count-entry"><b id="countValue">?</b><span>черт</span></div><div class="count-pad" id="countPad"></div><button id="checkCount" class="primary" style="width:100%" disabled>Проверить</button></div></div>';putGlyph('#quizGlyph',ch);for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i;b.onclick=()=>{session.q.number=i;$('#countValue').textContent=i;$('#countPad').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));$('#checkCount').disabled=false};$('#countPad').append(b)}$('#checkCount').onclick=()=>grade(session.q.number===C[ch].strokes.length,`${ch}: ${C[ch].strokes.length} ${strokeWord(C[ch].strokes.length)}.`)}
// Trace assessment compares direction, coverage, and proximity to the real median path.
function resample(points,spacing=12){if(points.length<2)return points;const a=[points[0]];for(let i=1;i<points.length;i++){let p=points[i-1],q=points[i],n=Math.max(1,Math.ceil(Math.hypot(q[0]-p[0],q[1]-p[1])/spacing));for(let k=1;k<=n;k++)a.push([p[0]+(q[0]-p[0])*k/n,p[1]+(q[1]-p[1])*k/n])}return a}function distance(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}function traceMatch(user,median){if(user.length<2)return false;const u=resample(user),m=resample(median);const near=(p,arr)=>Math.min(...arr.map(q=>distance(p,q)));const coverage=m.filter(p=>near(p,u)<95).length/m.length,precision=u.filter(p=>near(p,m)<110).length/u.length;const len=a=>a.slice(1).reduce((s,p,i)=>s+distance(p,a[i]),0);const ratio=len(u)/Math.max(1,len(m));const mv=[m.at(-1)[0]-m[0][0],m.at(-1)[1]-m[0][1]],uv=[u.at(-1)[0]-u[0][0],u.at(-1)[1]-u[0][1]],ml=Math.hypot(...mv),ul=Math.hypot(...uv);const direction=ml<60||(ul>20&&(mv[0]*uv[0]+mv[1]*uv[1])/(ml*ul)>.2);return direction&&distance(u[0],m[0])<155&&distance(u.at(-1),m.at(-1))<160&&coverage>.72&&precision>.72&&ratio>.45&&ratio<2.4}
function trace(ch){const d=C[ch],missing=rnd(d.strokes.length);session.q.missing=missing;session.q.user=[];session.q.drawing=false;session.q.tries=0;shell('Дорисуйте пропавшую черту','На рисунке не хватает одной черты. Нарисуйте её за одно движение в правильном направлении.');$('#playArea').innerHTML=`<div class="quiz-layout"><div><div class="trace-stage" id="traceStage"></div><p class="under">${ch} · ${d.py} · ${d.meaning}</p></div><div><h3>Один знак — одна точная черта</h3><p class="trace-note">Не обводите готовые части. Найдите пустое место и восстановите знак.</p><p id="traceHint" class="draw-hint">Пишите пальцем, стилусом или мышью.</p><div class="trace-tools"><button id="clearTrace">Стереть попытку</button><button id="traceHelp">Показать начало</button><button id="checkTrace" class="primary" disabled>Проверить черту</button></div></div></div>`;let s=glyph(ch,{missing,grid:true});s.style.touchAction='none';const group=svgEl('g',{id:'userStroke'});s.append(group);$('#traceStage').append(s);let line;function coords(e){let r=s.getBoundingClientRect();return[(e.clientX-r.left)*1024/r.width,(e.clientY-r.top)*1024/r.height]}s.onpointerdown=e=>{if(session.locked)return;e.preventDefault();s.setPointerCapture(e.pointerId);session.q.user=[coords(e)];session.q.drawing=true;group.replaceChildren();line=svgEl('polyline',{fill:'none',stroke:'#df8853','stroke-width':26,'stroke-linecap':'round','stroke-linejoin':'round'});group.append(line);$('#checkTrace').disabled=true};s.onpointermove=e=>{if(!session.q.drawing||!s.hasPointerCapture(e.pointerId))return;e.preventDefault();session.q.user.push(coords(e));line.setAttribute('points',session.q.user.map(p=>p.join(',')).join(' '))};s.onpointerup=e=>{if(!session||session.locked||session.ended)return;if(session.q.drawing){session.q.user.push(coords(e));line.setAttribute('points',session.q.user.map(p=>p.join(',')).join(' '));session.q.drawing=false;$('#checkTrace').disabled=session.q.user.length<2}if(s.hasPointerCapture(e.pointerId))s.releasePointerCapture(e.pointerId)};s.onpointercancel=()=>{session.q.drawing=false};$('#clearTrace').onclick=()=>{group.replaceChildren();session.q.user=[];$('#checkTrace').disabled=true};$('#traceHelp').onclick=()=>{session.usedHints++;const m=d.medians[missing],p=m[0];s.append(svgEl('circle',{cx:p[0],cy:900-p[1],r:20,fill:'#e9b644',stroke:'white','stroke-width':6}));$('#traceHint').textContent='Начните у жёлтой точки. Черта: '+d.names[missing]+'.';$('#traceHelp').disabled=true};$('#checkTrace').onclick=()=>{const median=d.medians[missing].map(p=>[p[0],900-p[1]]);if(traceMatch(session.q.user,median)){if(session.q.tries)session.usedHints++;grade(true,'Черта восстановлена. Это '+(missing+1)+'-я черта в порядке написания.')}else{session.q.tries++;if(!session.hasAttemptError){record(ch,false);session.hasAttemptError=true;if(!session.errors.includes(ch))session.errors.push(ch)}playSound(false);$('#traceHint').textContent='Попробуйте ещё раз: проверьте начало, направление и длину черты. Можно показать точку начала.'}}}
function puzzle(ch){const parts=C[ch].parts;session.q.placed=Array(parts.length).fill(null);session.q.selected=null;session.q.bank=parts.map((p,i)=>({ch,part:p,id:'answer'+i,used:false}));const canonical=t=>t.replace(/ 左| 右/g,'');const correctLabels=parts.map(p=>canonical(p.label));const bankSize=+profile.settings.bank||12;const distract=[];outer:for(const x of shuffle(CH)){for(const p of shuffle(C[x].parts||[])){if(!correctLabels.includes(canonical(p.label))&&!distract.some(a=>canonical(a.part.label)===canonical(p.label))){distract.push({ch:x,part:p,id:'extra'+distract.length,used:false});if(distract.length>=bankSize-parts.length)break outer;}}}session.q.bank=shuffle([...session.q.bank,...distract]);shell('Соберите иероглиф из частей','Выберите часть, затем место для неё. На компьютере можно перетаскивать. В банке много лишних частей: внимательно сравнивайте их форму.');$('#playArea').innerHTML=`<div class="puzzle-layout"><div><p class="clue" style="text-align:center"><b>${ch} · ${C[ch].py}</b><br>${C[ch].meaning}</p><div class="puzzle-target" id="puzzleTarget"></div><div class="target-slots" id="targetSlots"></div></div><div><h3 style="text-align:center">Банк частей</h3><div class="part-bank" id="partBank"></div><div class="small-actions" style="justify-content:center"><button id="clearPuzzle">Разобрать</button><button id="checkPuzzle" class="primary" disabled>Проверить сборку</button></div><p class="micro" style="text-align:center">${C[ch].structure}</p></div></div>`;renderPuzzle();$('#clearPuzzle').onclick=()=>{session.q.placed.fill(null);session.q.bank.forEach(b=>b.used=false);session.q.selected=null;renderPuzzle()};$('#checkPuzzle').onclick=()=>{const ok=session.q.placed.every((id,i)=>id==='answer'+i);grade(ok,ok?'Части встали на свои места.':'Порядок частей: '+parts.map(p=>p.label).join(' + ')+'.');if(!ok)$('#puzzleTarget').replaceChildren(glyph(ch,{colorful:true}))}}
function placePiece(slot,id){if(session.locked)return;const b=session.q.bank.find(b=>b.id===id);if(!b||b.used)return;const prev=session.q.placed[slot];if(prev){session.q.bank.find(x=>x.id===prev).used=false}session.q.placed[slot]=b.id;b.used=true;session.q.selected=null;renderPuzzle()}

const TONED={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function plainPinyin(s){return s.normalize('NFD').replace(/[\u0304\u0301\u030c\u0300]/g,'').normalize('NFC')}
function toneOf(s){for(const chars of Object.values(TONED))for(let i=0;i<chars.length;i++)if(s.includes(chars[i]))return i+1;return 0}
function withTone(s,t){let b=plainPinyin(s);if(!t)return b;let i=b.indexOf('a');if(i<0)i=b.indexOf('e');if(i<0&&b.includes('ou'))i=b.indexOf('o');if(i<0){for(let k=b.length-1;k>=0;k--)if('aeiouü'.includes(b[k])){i=k;break}}if(i<0)return b;return b.slice(0,i)+TONED[b[i]][t-1]+b.slice(i+1)}

function odd(ch){const root=C[ch].radicalGroup,group=pick(Object.keys(ODD_GROUPS).filter(k=>k!==root)),pair=shuffle(ODD_GROUPS[group].chars.filter(x=>x!==ch)).slice(0,5),values=balancedChoices(ch,pair,6);session.q.group=group;shell('Кто здесь лишний?','У пяти знаков один общий ключ или две формы одного ключа. Найдите единственный знак с другим ключом.');$('#playArea').innerHTML='<div class="odd-options" id="oddOptions"></div><div class="small-actions" style="justify-content:center"><button id="oddHint">Подсказка к общему ключу</button></div><p class="under" id="oddHintText"></p>';values.forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{document.querySelectorAll('#oddOptions button').forEach(x=>x.classList.add(x.textContent===ch?'good':x===b?'bad':'neutral'));grade(v===ch,`Общий ключ пяти знаков: ${ODD_GROUPS[group].name}. У ${ch} — ключ ${C[ch].rad}.`)};$('#oddOptions').append(b)});$('#oddHint').onclick=()=>{session.usedHints++;$('#oddHintText').textContent='Ищите общий элемент: '+ODD_GROUPS[group].name+'.';$('#oddHint').disabled=true}}

function ordinalStroke(ch){const ordinal=session.ordinals[session.pos],name=C[ch].names[ordinal-1];session.q.ordinal=ordinal;session.q.name=name;const alternatives=balancedChoices(name,Object.keys(DATA.strokeSamples).filter(x=>x!==name),4);shell(`Какая черта пишется ${ordinal===1?'первой':'второй'}?`,'Выберите вид черты. У сложной черты несколько поворотов могут быть одним движением.');$('#playArea').innerHTML=`<div class="quiz-layout"><div><div class="glyph large" id="ordinalGlyph"></div><p class="under">${ch} · ${C[ch].py} · ${C[ch].meaning}</p></div><div><div class="stroke-choices" id="strokeChoices"></div><div class="small-actions"><button id="ordinalHint">Подсказка</button></div><p class="micro" id="ordinalHelp"></p></div></div>`;putGlyph('#ordinalGlyph',ch);alternatives.forEach(n=>{const b=document.createElement('button');b.className='stroke-option';b.dataset.strokeName=n;b.append(sampleStroke(n));let sm=document.createElement('span');sm.textContent=n+' — '+DATA.strokeSamples[n].ru;b.append(sm);b.onclick=()=>{document.querySelectorAll('.stroke-option').forEach(x=>x.classList.add(x.dataset.strokeName===name?'good':x===b?'bad':'neutral'));grade(n===name,`${ordinal===1?'Первая':'Вторая'} черта ${ch}: ${name} — ${DATA.strokeSamples[name].ru}.`)};$('#strokeChoices').append(b)});$('#ordinalHint').onclick=()=>{session.usedHints++;$('#ordinalHelp').textContent=ordinal===1?'Начните с верхней или левой части знака. Найдите движение, с которого начинается образец.':`Первая черта — ${C[ch].names[0]}. Теперь выберите следующую.`;$('#ordinalHint').disabled=true}}
function makeHuntBoard(ch){const targets=[ch,...shuffle(CH.filter(x=>x!==ch)).slice(0,2)],filler=[...new Set([...CH,...Object.values(ODD_GROUPS).flatMap(g=>g.chars)])].filter(x=>!targets.includes(x)),positions=[];for(let q=0;q<4;q++){const rows=q<2?[0,1,2,3]:[4,5,6,7],cols=q%2?[4,5,6,7]:[0,1,2,3];positions.push(pick(rows)*8+pick(cols))}positions.push(...shuffle(Array.from({length:64},(_,i)=>i).filter(i=>!positions.includes(i))).slice(0,2));const symbols=shuffle(targets.flatMap(x=>[x,x])),board=Array.from({length:64},()=>({ch:pick(filler),target:false,found:false}));positions.forEach((p,i)=>board[p]={ch:symbols[i],target:true,found:false});return {targets,board}}
function hunt(ch){const h=makeHuntBoard(ch);Object.assign(session.q,h,{found:0,wrong:0});shell('Найдите заданные иероглифы','Нажимайте на все нужные знаки в поле. Каждый заданный знак встречается ровно два раза.');$('#playArea').innerHTML=`<div class="hunt-top"><div class="hunt-targets">${h.targets.map(x=>'<span>'+x+'</span>').join('')}</div><b id="huntCount">Найдено 0 / 6</b></div><div class="hunt-grid" id="huntGrid"></div><p class="under" id="huntHint">Рассмотрите всё поле: нужные знаки стоят в разных местах.</p>`;h.board.forEach((cell,i)=>{const b=document.createElement('button');b.className='hunt-cell';b.dataset.cell=i;let s=document.createElement('span');s.textContent=cell.ch;s.style.transform=`translate(${rnd(7)-3}px,${rnd(7)-3}px) rotate(${pick([-8,0,8])}deg)`;b.append(s);b.onclick=()=>{if(session.locked||cell.found)return;if(cell.target){cell.found=true;session.q.found++;b.classList.add('found');b.disabled=true;$('#huntCount').textContent='Найдено '+session.q.found+' / 6';if(session.q.found===6)grade(true,'Найдены все заданные знаки: '+h.targets.join('、')+'.')}else{cell.found=true;session.q.wrong++;session.hasAttemptError=true;session.usedHints++;b.classList.add('wrong');b.disabled=true;$('#huntHint').textContent='Этот знак не входит в задание. Сверьте его с тремя образцами.';playSound(false)}};$('#huntGrid').append(b)})}
function revealHunt(){if(!session.q.board)return;session.q.board.forEach((c,i)=>{if(c.target)document.querySelector(`[data-cell="${i}"]`)?.classList.add('found')})}
function imageTile(ch,tile){const row=Math.floor(tile/2),col=tile%2,s=svgEl('svg',{viewBox:`${col*512} ${row*512} 512 512`,role:'img','aria-label':'Фрагмент пазла'}),g=svgEl('g',{transform:'translate(0 900) scale(1 -1)'});C[ch].strokes.forEach(p=>g.append(svgEl('path',{d:p,fill:'#24504b'})));s.append(g);return s}
function imagePuzzle(ch){session.q.tileOrder=shuffle([0,1,2,3]);session.q.tiles=Array(4).fill(null);session.q.tileSelected=null;shell('Соберите пазл иероглифа','Соедините четыре фрагмента в цельный знак. Выберите фрагмент и место или перетащите его.');$('#playArea').innerHTML=`<div class="image-puzzle-layout"><div><h3 style="text-align:center">${ch} · ${C[ch].py} · ${C[ch].meaning}</h3><div class="image-board" id="imageBoard"></div></div><div><h3 style="text-align:center">Четыре фрагмента</h3><div class="image-bank" id="imageBank"></div><div class="small-actions" style="justify-content:center"><button id="imageClear">Разобрать пазл</button><button id="imageHint">Показать образец</button><button id="imageCheck" class="primary" disabled>Проверить пазл</button></div><div id="imageSample" class="image-sample"></div></div></div>`;renderImagePuzzle();$('#imageClear').onclick=()=>{session.q.tiles.fill(null);session.q.tileSelected=null;renderImagePuzzle()};$('#imageHint').onclick=()=>{session.usedHints++;$('#imageSample').append(glyph(ch,{colorful:true}));$('#imageHint').disabled=true};$('#imageCheck').onclick=()=>{const ok=session.q.tiles.every((v,i)=>v===i);if(!ok){session.q.tiles=[0,1,2,3];renderImagePuzzle()}grade(ok,ok?'Фрагменты образовали цельный иероглиф.':'Посмотрите, как фрагменты соединяются в правильном образце.')};}
function putImageTile(slot,tile){if(session.locked||!Number.isInteger(tile)||tile<0||tile>3||session.q.tiles.includes(tile))return;session.q.tiles[slot]=tile;session.q.tileSelected=null;renderImagePuzzle()}
function renderImagePuzzle(){const q=session.q;$('#imageBoard').innerHTML='';q.tiles.forEach((t,i)=>{let b=document.createElement('button');b.className='image-slot';b.dataset.imageSlot=i;if(t!==null)b.append(imageTile(q.ch,t));else b.textContent=i+1;b.onclick=()=>{if(q.tileSelected!==null)putImageTile(i,q.tileSelected);else if(t!==null){q.tiles[i]=null;renderImagePuzzle()}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(raw!=='')putImageTile(i,+raw)};$('#imageBoard').append(b)});$('#imageBank').innerHTML='';q.tileOrder.forEach(t=>{const b=document.createElement('button');b.className='image-tile'+(q.tiles.includes(t)?' used':'')+(q.tileSelected===t?' selected':'');b.disabled=q.tiles.includes(t);b.draggable=!b.disabled;b.dataset.tile=t;b.append(imageTile(q.ch,t));b.onclick=()=>{q.tileSelected=t;renderImagePuzzle()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',t);$('#imageBank').append(b)});$('#imageCheck').disabled=q.tiles.some(x=>x===null)}
function wordBuilder(word){const d=C[word],chars=[...word],answer=chars[1];session.q.word=word;const alternatives=balancedChoices(answer,CH.filter(x=>x!==answer),6);shell('Подберите второй иероглиф','Прочитайте перевод и дополните двусложное слово. Первый иероглиф уже на месте.');$('#playArea').innerHTML=`<p class="word-task-meaning">${d.meaning}</p><div class="word-assembly"><span class="given-character">${chars[0]}</span><span class="word-plus">＋</span><span class="missing-character" id="wordMissing">?</span></div><div class="word-options" id="wordOptions"></div><div class="small-actions" style="justify-content:center"><button id="wordHint">Подсказка к чтению</button></div><p class="under" id="wordReading"></p>`;alternatives.forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.dataset.second=c;b.onclick=()=>{document.querySelectorAll('#wordOptions button').forEach(x=>x.classList.add(x.textContent===answer?'good':x===b?'bad':'neutral'));$('#wordMissing').textContent=answer;grade(c===answer,`${word} · ${d.py} — ${d.meaning}.`)};$('#wordOptions').append(b)});$('#wordHint').onclick=()=>{session.usedHints++;$('#wordReading').textContent='Прочитайте: '+d.py;$('#wordHint').disabled=true}}

$('#home').onclick=home;$('#dictionary').onclick=dictionary;$('#results').onclick=showResults;$('#resetAllResults').onclick=confirmResetResults;$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.start)start(+b.dataset.start);if(b.dataset.study)study(b.dataset.study)});$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♪ Звук включён':'♪ Звук выключен';if(soundOn)playSound(true)};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Полный экран недоступен в этом просмотрщике')}};$('#download').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#modal').classList.remove('open');copy.querySelectorAll('.pop').forEach(x=>x.remove());const blob=new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Time_Hanzi_14_Games.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
home();
