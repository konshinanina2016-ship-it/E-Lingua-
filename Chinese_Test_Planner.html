*{box-sizing:border-box}body{margin:0;background:#f5f1e7;color:#173934;font:17px system-ui,sans-serif}main{max-width:880px;margin:auto;padding:24px 16px}header,section{border-radius:24px;padding:clamp(18px,4vw,34px);margin-bottom:18px}header{background:#124d44;color:#fff}h1{font-size:clamp(27px,6vw,48px);margin:12px 0}h2{margin-top:0}.badge{display:inline-grid;place-items:center;border-radius:50%;background:#f9d890;color:#173934;width:48px;height:48px;font-size:23px}section{background:#fffdf8;border:1px solid #dbded3}input,textarea,select,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #829e94;min-width:0}input,textarea,select{width:100%;background:white;color:inherit}label{display:block;margin-bottom:12px}button{cursor:pointer;background:#176758;color:white;margin:4px 4px 4px 0}button.secondary{background:#edf5ef;color:#173934}button:disabled{cursor:default;opacity:.85}button.good{background:#176758}button.bad{background:#a12f3c}.grid,.row,.options{display:grid;gap:8px}.row{grid-template-columns:1fr 1fr 1fr auto;margin:6px 0}.grid,.options{grid-template-columns:repeat(2,minmax(0,1fr))}.option{font-size:clamp(19px,4vw,26px);overflow-wrap:anywhere;min-height:62px}#prompt{font-size:clamp(26px,7vw,48px);overflow-wrap:anywhere;margin:14px 0}progress{width:100%;accent-color:#176758}small{display:block;color:#43625a}#notice{color:#942e32}li{margin:10px 0;overflow-wrap:anywhere}@media(max-width:520px){.grid,.options{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row input:nth-child(3){grid-column:1}}

<script>
'use strict';
const el=id=>document.getElementById(id);
const key='chinese-test-planner-v1';
const labels=['Иероглифы','Пиньинь','Перевод'];
let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch{}
let words=Array.isArray(saved.words)?saved.words.slice(0,100):[];
el('topic').value=saved.topic||'';
el('mode').value=saved.mode==='1'?'1':'0';
el('amount').value=saved.amount||'';
let questions=[],index=0,answers=[],timer,deadline=0,attempt;
el('minutes').value=saved.minutes||'0';
function tick(){
 const seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 el('clock').textContent='Осталось '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
 if(!seconds)finish(true);
}
function startClock(){
 clearInterval(timer);
 el('clock').hidden=!attempt.minutes;
 deadline=attempt.minutes?Date.now()+attempt.minutes*60000:0;
 if(deadline){tick();timer=setInterval(tick,250);}
}
function save(){
 el('count').textContent='Строк в словаре: '+words.length+' / 100';
 el('add').disabled=words.length>=100;
 try{localStorage.setItem(key,JSON.stringify({words,topic:el('topic').value,mode:el('mode').value,minutes:el('minutes').value,amount:el('amount').value}));}
 catch{el('storage').textContent='Браузер ограничил сохранение черновика.';}
}
function render(){
 el('rows').replaceChildren();
 words.forEach((word,i)=>{
  const row=document.createElement('tr');
  labels.forEach((label,j)=>{
   const input=document.createElement('input');
   input.value=word[j];input.placeholder=label;input.setAttribute('aria-label',label+', строка '+(i+1));
   if(j===0)input.lang='zh';
   input.oninput=()=>{word[j]=input.value;save();};
   input.onpaste=event=>{
    const pasted=event.clipboardData.getData('text/plain').trim();
    if(!pasted.includes('\t')&&!pasted.includes('\n'))return;
    event.preventDefault();
    const matrix=pasted.split(/\r?\n/).map(line=>line.split('\t').map(value=>value.trim()));
    if(i+matrix.length>100||matrix.some(cells=>cells.length+j>3)){
     el('notice').textContent='Проверьте размер вставки. В таблице три столбца и до 100 строк.';return;
    }
    matrix.forEach((cells,offset)=>{
     const target=words[i+offset]??(words[i+offset]=['','','']);
     cells.forEach((value,column)=>{target[j+column]=value;});
    });
    el('notice').textContent='';render();
   };
   row.insertCell().append(input);
  });
  const remove=document.createElement('button');remove.className='secondary';remove.textContent='×';
  remove.setAttribute('aria-label','Удалить строку '+(i+1));
  remove.onclick=()=>{words.splice(i,1);render();};
  row.insertCell().append(remove);el('rows').append(row);
 });
 save();
}
function append(items){
 if(words.length+items.length>100){el('notice').textContent='Лимит — 100 строк. Освободите место и повторите.';return false;}
 words.push(...items);el('notice').textContent='';render();return true;
}
el('add').onclick=()=>{if(append([['','','']]))el('rows').lastElementChild.querySelector("input").focus();};
el('import').onclick=()=>{
 const lines=el('bulk').value.split(/\r?\n/).filter(line=>line.trim());
 const items=lines.map(line=>line.split(line.includes('\t')?'\t':'|').map(value=>value.trim()));
 const bad=items.findIndex(row=>row.length!==3||row.some(value=>!value));
 if(bad>=0){el('notice').textContent='Проверьте строку '+(bad+1)+' списка. Нужны иероглифы, пиньинь и перевод.';return;}
 if(items.length&&append(items))el('bulk').value='';
};
for(const id of ['topic','mode','amount','minutes'])el(id).oninput=save;
function shuffle(items){
 const copy=items.slice();
 for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
 return copy;
}
const normalize=value=>value.normalize('NFC').replace(/\s+/g,' ').toLowerCase();
function show(id){for(const panel of ['editor','quiz','result'])el(panel).hidden=panel!==id;window.scrollTo(0,0);}
function start(){
 const student=['first','last','group'].map(id=>el(id).value.trim());
 const missing=student.indexOf('');
 if(missing>=0){
  el('notice').textContent='Введите имя, фамилию и класс ученика.';
  el(['first','last','group'][missing]).focus();return;
 }
 const bank=words.map(row=>row.map(value=>value.trim())).filter(row=>row.some(Boolean));
 const bad=bank.findIndex(row=>row.some(value=>!value));
 if(bad>=0){el('notice').textContent='Заполните все три поля в каждой используемой строке.';return;}
 const cue=el('mode').value==='1'?1:2;
 const mode=0;
 const groups=new Map(), pool=new Map();
 for(const row of bank){
  const promptKey=normalize(row[cue]), answerKey=normalize(row[mode]);
  pool.set(answerKey,row[mode]);
  if(!groups.has(promptKey))groups.set(promptKey,{prompt:row[cue],correct:new Set()});
  groups.get(promptKey).correct.add(answerKey);
 }
 const usable=[...groups.values()].filter(group=>group.correct.size<pool.size);
 if(!usable.length){el('notice').textContent='Добавьте минимум два разных вопроса с различимыми вариантами ответа для выбранного режима.';return;}
 const amount=el('amount').value===''?usable.length:Number(el('amount').value);
 if(!Number.isInteger(amount)||amount<1||amount>usable.length){el('notice').textContent='Для этого режима доступно вопросов: '+usable.length+'. Укажите число от 1 до '+usable.length+' или оставьте поле пустым.';return;}
 el('notice').textContent='';
 questions=shuffle(usable).slice(0,amount).map(group=>{
  const correct=shuffle([...group.correct])[0];
  const distractors=shuffle([...pool.keys()].filter(value=>!group.correct.has(value))).slice(0,3);
  return {prompt:group.prompt,correct:pool.get(correct),options:shuffle([correct,...distractors]).map(value=>pool.get(value))};
 });
 answers=[];index=0;el('quizTitle').textContent=el('topic').value.trim()||'Словарный тест';
 attempt={student,minutes:Number(el('minutes').value),topic:el('quizTitle').textContent,mode:el('mode').selectedOptions[0].textContent};
 resetAnswers();
}
function question(){
 const item=questions[index];
 el('step').textContent='Вопрос '+(index+1)+' из '+questions.length+' · '+el('mode').selectedOptions[0].textContent;
 el('progress').max=questions.length;el('progress').value=index;
 el('prompt').textContent=item.prompt;
 el('prompt').lang=el('mode').value==='0'?'ru':'zh-Latn-pinyin';
 el('options').replaceChildren();el('feedback').textContent='';el('next').hidden=true;
 for(const value of item.options){
  const button=document.createElement('button');button.className='secondary option';button.textContent=value;
  button.lang='zh';
  button.onclick=()=>{
   if(deadline&&Date.now()>=deadline){finish(true);return;}
   answers.push(value);
   for(const option of el('options').children){
    option.disabled=true;
    if(option.textContent===item.correct)option.className='option good';
    else if(option===button)option.className='option bad';
   }
   el('feedback').textContent=value===item.correct?'Верно!':'Правильный ответ — '+item.correct;
   el('progress').value=index+1;
   el('next').textContent=index+1===questions.length?'Показать результат':'Далее';
   el('next').hidden=false;el('next').focus();
  };
  el('options').append(button);
 }
 el('options').firstElementChild.focus();
}
el('next').onclick=()=>{
 if(deadline&&Date.now()>=deadline){finish(true);return;}
 index++;
 if(index<questions.length){question();return;}
 finish(false);
};
function finish(expired){
 clearInterval(timer);deadline=0;
 const [first,last,group]=attempt.student;
 el('report').textContent=attempt.topic+' · '+attempt.mode+' · '+first+' '+last+' · класс '+group+(expired?' · Время вышло':'');
 el('mistakes').replaceChildren();let correct=0;
 questions.forEach((item,i)=>{
  if(answers[i]===item.correct){correct++;return;}
  const li=document.createElement('li');li.textContent=item.prompt+' — ваш ответ: '+(answers[i]??'нет ответа')+'. Правильно: '+item.correct+'.';el('mistakes').append(li);
 });
 const percent=correct/questions.length*100;
 const [message,translation]=percent>=90?['太棒了！','Здорово!']:
  percent>=60?['做得不错，继续加油！','Хорошая работа, так держать!']:
  ['别着急，再试一次吧！','Не спеши, попробуй ещё раз!'];
 el('dragonMessage').textContent=message;
 el('dragonTranslation').textContent=translation;
 el('score').textContent=correct+' из '+questions.length+' · '+Math.round(correct/questions.length*100)+'%';
 show('result');
}
el('print').onclick=()=>window.print();
function resetAnswers(){
 answers=[];index=0;show('quiz');question();startClock();
}
el('start').onclick=start;
el('retry').onclick=resetAnswers;
el('resetQuiz').onclick=resetAnswers;
const testsKey=key+'-topics';
let tests=[];
try{tests=JSON.parse(localStorage.getItem(testsKey)||'[]');}catch{}
function listTopics(selected=''){
 const select=el('topics');
 select.replaceChildren(new Option(tests.length?'Выберите тему':'Пока нет сохранённых тестов',''));
 for(const test of tests)select.add(new Option(test.topic,test.topic));
 select.value=selected;
 el('loadTest').disabled=!selected;
}
el('topics').onchange=()=>{el('loadTest').disabled=!el('topics').value;};
el('saveTest').onclick=()=>{
 const topic=el('topic').value.trim();
 if(!topic){el('notice').textContent='Введите название темы.';return;}
 const bank=words.map(row=>row.map(value=>value.trim())).filter(row=>row.some(Boolean));
 if(bank.length<2||bank.some(row=>row.some(value=>!value))){
  el('notice').textContent='Добавьте хотя бы два слова и заполните все три столбца.';return;
 }
 const previous=tests.some(test=>test.topic===topic);
 if(previous&&!confirm('Обновить сохранённый тест «'+topic+'»?'))return;
 const updated=tests.filter(test=>test.topic!==topic);
 updated.push({topic,words:bank,mode:el('mode').value,minutes:el('minutes').value,amount:el('amount').value});
 try{localStorage.setItem(testsKey,JSON.stringify(updated));}
 catch{el('notice').textContent='Браузер не разрешил сохранить тест.';return;}
 tests=updated;listTopics(topic);el('notice').textContent='Тест сохранён в этом браузере.';
};
el('loadTest').onclick=()=>{
 const test=tests.find(item=>item.topic===el('topics').value);
 if(!test)return;
 if(!confirm('Открыть тему «'+test.topic+'» и заменить текущий черновик?'))return;
 words=test.words.map(row=>row.slice());
 el('topic').value=test.topic;el('mode').value=test.mode==='1'?'1':'0';el('amount').value=test.amount;
 el('minutes').value=test.minutes||'0';
 el('notice').textContent='';render();
};
listTopics();
el('newTest').onclick=()=>{
 if((el('topic').value||words.some(row=>row.some(value=>value.trim())))&&
    !confirm('Очистить текущий черновик и создать новый тест?'))return;
 words=[['','','']];
 for(const id of ['topic','amount','first','last','group'])el(id).value='';
 el('mode').value='0';el('minutes').value='0';
 el('notice').textContent='';listTopics();render();el('topic').focus();
};
document.querySelectorAll('.back').forEach(button=>button.onclick=()=>{clearInterval(timer);deadline=0;show('editor');});
if(!words.length)words=[['','','']];
render();
</script></html>
