q('jì · записывать, помнить','讠',['扌','氵','忄'],'讠 + 己 → 记','□ 己  ·  Слева'),
q('xiǎng · думать, хотеть','心',['手','木','火'],'相 + 心 → 想','相\n□  ·  Снизу')
]],
['🧱','Собери один иероглиф','Собери знак по чтению и переводу. Добавляй части слева направо или сверху вниз. Для знака с рамкой начни с рамки.',[
...[
['dǎ · бить, ударять','扌丁',['丁','扌','寸','讠'],'扌 + 丁 → 打 dǎ'],
['xùn · обучать, наставлять','讠川',['川','讠','三','扌'],'讠 + 川 → 训 xùn'],
['dǒng · понимать','忄董',['董','忄','心','重'],'忄 + 董 → 懂 dǒng'],
['guó · страна, государство','囗玉',['玉','口','囗','王'],'囗 + 玉 → 国 guó'],
['wàng · забывать','亡心',['心','亡','方','忄'],'亡 + 心 → 忘 wàng'],
['tīng · слушать','口斤',['斤','口','囗','丁'],'口 + 斤 → 听 tīng']
].map(([p,a,d,e])=>tiles(p,a,d,e))]]
);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mix=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const range=n=>Array.from({length:n},(_,i)=>i);
const KEY='new-era14-lex-v1';
let saved;
try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}
const fresh=()=>({revision:2,order:games.map(g=>mix(range(g[3].length))),attempts:games.map(()=>[]),name:''});
let state=fresh(),page=0,selected=[];
if(saved?.order && saved?.attempts){
 state.name=typeof saved.name==='string'?saved.name:'';
 for(const i of range(games.length)){
  if(saved.revision!==2 && (i===14 || i===15))continue;
  if(saved.order[i]?.length===games[i][3].length && Array.isArray(saved.attempts[i])){
   state.order[i]=saved.order[i];
   state.attempts[i]=saved.attempts[i];
  }
 }
}
const lastPage=games.length+4;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const slide=document.querySelector('#slide');
const normalize=s=>s.normalize('NFC').toLowerCase().replace(/[\s·，。？！,.!?'-]/g,'');
const total=games.reduce((sum,g)=>sum+g[3].length,0);
const score=i=>state.attempts[i].filter(a=>a.ok).length;
const done=()=>state.attempts.reduce((sum,a)=>sum+a.length,0);
const points=()=>games.reduce((sum,g,i)=>sum+score(i),0);
const goto=n=>{page=Math.min(lastPage,Math.max(0,n));selected=[];render();window.scrollTo(0,0);slide.focus({preventScroll:true})};
slide.tabIndex=-1;
function table(rows){return '<div class="table"><table><thead><tr><th>Игра</th><th>Выполнено</th><th>Верно</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
function results(){return table(games.map((g,i)=>'<tr><td>'+esc(g[1])+'</td><td>'+state.attempts[i].length+' / '+g[3].length+'</td><td>'+score(i)+'</td></tr>').join(''))}
function render(){
 slide.className=page===0?'cover':'';
 document.querySelector('#progress').textContent='Ответы '+done()+' / '+total+' · Верно '+points();
 document.querySelector('#back').disabled=page===0;
 document.querySelector('#next').disabled=page===lastPage;
 if(page===0){slide.innerHTML='<div><div class="eyebrow">HSK 2 · УРОК 14 · ЧАСТЬ 2</div><h1>Строим планы<br>на сентябрь</h1><p lang="zh">我们见个面</p><p>17 лексических игр, словарик и разбор употребления</p><button class="primary" data-go="1">Начать →</button></div><div class="art" aria-hidden="true">🐉</div>';return}
 if(page===1){slide.innerHTML='<h1>Содержание</h1><div class="tools"><button data-go="2">📖 Словарик</button><button data-go="3">💡 Лексический комментарий</button><button data-go="'+lastPage+'">📄 Результаты для учителя</button></div><div class="cards">'+games.map((g,i)=>'<button data-go="'+(4+i)+'">'+g[0]+' '+(i+1)+'. '+g[1]+'<br><small>'+state.attempts[i].length+' / '+g[3].length+' выполнено</small></button>').join('')+'</div>';return}
 if(page===2){slide.innerHTML='<h1>Словарик 生词</h1><div class="tools"><button id="pinyin" aria-pressed="false">Скрыть пиньинь</button></div><div class="table"><table><thead><tr><th>Слово</th><th class="py">Пиньинь</th><th>Значение</th><th>Пример</th></tr></thead><tbody>'+words.map(w=>'<tr>'+w.map((v,j)=>'<td'+(j===1?' class="py"':j===0?' lang="zh"':'')+'>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';document.querySelector('#pinyin').onclick=e=>{const hide=e.target.getAttribute('aria-pressed')==='false';e.target.setAttribute('aria-pressed',hide);e.target.textContent=hide?'Показать пиньинь':'Скрыть пиньинь';slide.querySelectorAll('.py').forEach(c=>c.hidden=hide)};return}
 if(page===3){slide.innerHTML='<h1>Лексический комментарий</h1><div class="cards">'+notes.map(([h,t])=>'<section class="card"><h2 lang="zh">'+h+'</h2>'+esc(t)+'</section>').join('')+'</div>';return}
 if(page===lastPage){slide.innerHTML='<h1>Результаты для учителя</h1><p>Верно '+points()+' из '+total+' · Выполнено '+done()+' из '+total+'</p><label>Имя ученика <input id="student" maxlength="100" autocomplete="name" value="'+esc(state.name)+'"></label>'+results()+'<div class="tools"><button class="primary" id="pdf">Отправить учителю · PDF</button></div><p class="small">В окне печати выбери «Сохранить как PDF», затем прикрепи файл в сообщении учителю.</p>';document.querySelector('#student').oninput=e=>{state.name=e.target.value;save()};document.querySelector('#pdf').onclick=printReport;return}
 const i=page-4,g=games[i],attempts=state.attempts[i],n=attempts.length;
 slide.innerHTML='<div class="eyebrow">ИГРА '+(i+1)+' ИЗ '+games.length+'</div><h1>'+g[0]+' '+g[1]+'</h1>';
 if(n===g[3].length){slide.innerHTML+='<p class="prompt">Верно '+score(i)+' из '+n+'</p><div class="tools"><button class="primary" data-go="'+(page+1)+'">'+(page===lastPage-1?'К результатам':'Следующая игра')+' →</button><button data-go="1">К содержанию</button><button id="retry">Пройти игру заново</button></div>';document.querySelector('#retry').onclick=()=>{if(confirm('Заменить результаты этой игры новой попыткой?')){state.attempts[i]=[];state.order[i]=mix(range(n));save();render()}};return}
 drawQuestion(i,n);
}
function drawQuestion(i,n){
 const g=games[i],item=g[3][state.order[i][n]],id=state.order[i][n];
 const choices=mix([...new Set([...item.answer,...item.options])]);
 const letters=mix(item.options);
 slide.insertAdjacentHTML('beforeend','<p>'+g[2]+'</p><div class="small">Задание '+(n+1)+' / '+g[3].length+'</div>'+(item.context?'<div class="context" lang="zh">'+esc(item.context)+'</div>':'')+'<p class="prompt">'+esc(item.prompt)+'</p><div id="interaction"></div><div id="feedback" aria-live="polite"></div>');
 const box=document.querySelector('#interaction'),feedback=document.querySelector('#feedback');
 const sketch=item.path?'<svg viewBox="0 0 100 100" width="230" style="max-width:100%;touch-action:none;cursor:crosshair;user-select:none" role="img" aria-label="Иероглиф с пропущенной чертой"><rect x="1" y="1" width="98" height="98" rx="5" fill="#fff8e9" stroke="#b98876"/><path d="M50 4V96 M4 50H96" stroke="#dcc0a8" stroke-dasharray="4 4"/><path d="'+item.path+'" fill="none" stroke="#302421" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path id="missing-stroke" d="'+item.missing+'" fill="none" stroke="#b92548" stroke-width="5" stroke-linecap="round" visibility="hidden"/><polyline id="ink" fill="none" stroke="#126b83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
 if(sketch)box.insertAdjacentHTML('beforebegin',sketch);
 let locked=false;
 function check(value,strokeCorrect){
  if(locked||!value.trim())return;
  locked=true;
  if(sketch)slide.querySelector("#missing-stroke").setAttribute("visibility","visible");
  const ok=strokeCorrect ?? item.answer.some(a=>normalize(a)===normalize(value));
  state.attempts[i].push({id,value,ok});save();
  box.querySelectorAll('button,input').forEach(el=>el.disabled=true);
  feedback.innerHTML='<p class="feedback '+(ok?'good':'')+'">'+(ok?'✓ Верно. ':'Правильный ответ — '+esc(item.answer.join(' / '))+'. ')+esc(item.explain)+'</p><button class="primary" id="continue">Продолжить →</button>';
  document.querySelector('#progress').textContent='Ответы '+done()+' / '+total+' · Верно '+points();
  document.querySelector('#continue').onclick=()=>goto(i+4);
  document.querySelector('#continue').focus();
 }
 if(item.type==='stroke'){
  box.innerHTML='<div class="tools"><button id="clear-ink" disabled>Стереть черту</button><button id="check-ink" class="primary" disabled>Проверить</button></div>';
  const svg=slide.querySelector('svg'),ink=svg.querySelector('#ink'),model=svg.querySelector('#missing-stroke');
  const clear=box.querySelector('#clear-ink'),verify=box.querySelector('#check-ink');
  let active=null,points=[];
  function addPoint(event){
   const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());
   points.push([point.x,point.y]);
   ink.setAttribute('points',points.map(pair=>pair.join(',')).join(' '));
  }
  clear.onclick=()=>{points=[];ink.removeAttribute('points');clear.disabled=verify.disabled=true};
  svg.onpointerdown=event=>{
   if(locked||active!==null||event.button!==0)return;
   active=event.pointerId;svg.setPointerCapture(active);points=[];addPoint(event);
   clear.disabled=verify.disabled=true;
  };
  svg.onpointermove=event=>{if(event.pointerId===active)addPoint(event)};
  svg.onpointerup=event=>{
   if(event.pointerId!==active)return;
   addPoint(event);active=null;clear.disabled=false;
   verify.disabled=Math.hypot(points[0][0]-points.at(-1)[0],points[0][1]-points.at(-1)[1])<4;
  };
  svg.onpointercancel=event=>{if(event.pointerId===active){active=null;clear.onclick()}};
  verify.onclick=()=>{
   const length=model.getTotalLength();
   const sample=Array.from({length:21},(_,k)=>model.getPointAtLength(k*length/20));
   const distance=([x,y],p)=>Math.hypot(x-p.x,y-p.y);
   const tolerance=Math.max(6,Math.min(13,length*.23));
   const ok=distance(points[0],sample[0])<=tolerance &&
    distance(points.at(-1),sample.at(-1))<=tolerance &&
    points.every(point=>sample.some(ref=>distance(point,ref)<=tolerance));
   check('Черта от руки',ok);
  };
 }else if(item.type==='choice'){
  box.className='choices';
  choices.forEach(value=>{const b=document.createElement('button');b.textContent=value;b.onclick=()=>check(value);box.append(b)});
 }else if(item.type==='text'){
  box.innerHTML='<form class="tools"><input aria-label="Ответ" autocomplete="off" spellcheck="false" required placeholder="Введи ответ"><button class="primary">Проверить</button></form>';
  box.firstChild.onsubmit=e=>{e.preventDefault();check(box.querySelector('input').value)};
 }else{
  box.innerHTML='<div id="built" class="context" aria-live="polite">Нажми на иероглифы</div><div class="chips"></div><div class="tools"><button id="undo">Убрать последний</button><button class="primary" id="check">Проверить</button></div>';
  const built=box.querySelector('#built'),bank=box.querySelector('.chips'),verify=box.querySelector('#check'),undo=box.querySelector('#undo');
  selected=[];
  const refresh=()=>{built.textContent=selected.map(k=>letters[k]).join('')||'Нажми на иероглифы';[...bank.children].forEach((b,k)=>b.disabled=selected.includes(k));verify.disabled=selected.length!==Array.from(item.answer[0]).length;undo.disabled=!selected.length};
  letters.forEach((l,k)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{if(selected.length<Array.from(item.answer[0]).length){selected.push(k);refresh()}};bank.append(b)});
  verify.onclick=()=>check(selected.map(k=>letters[k]).join(''));undo.onclick=()=>{selected.pop();refresh()};refresh();
 }
}
async function printReport(){
 const details=games.map((g,i)=>{
  const missed=state.attempts[i].filter(a=>!a.ok);
  return missed.length?'<h3>'+esc(g[1])+'</h3><ul>'+missed.map(a=>{const item=g[3][a.id];return '<li>'+esc(item.prompt)+' · ответ ученика <b>'+esc(a.value)+'</b> · верно <b>'+esc(item.answer.join(' / '))+'</b></li>'}).join('')+'</ul>':'';
 }).join('');
 document.querySelector('#print').innerHTML='<h1>Результаты по лексике</h1><p>Китайский язык. Новая эра · HSK 2 · Урок 14, часть 2</p><p>Ученик — '+esc(state.name.trim()||'________________')+'<br>Дата — '+new Date().toLocaleDateString('ru-RU')+'</p><p>Выполнено '+done()+' / '+total+' · Верно '+points()+' / '+total+'</p>'+results()+(details?'<h2>Ответы для разбора</h2>'+details:'');
 if(document.fullscreenElement && document.exitFullscreen){
  try{await document.exitFullscreen()}catch{}
 }
 window.print();
}
slide.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)goto(Number(b.dataset.go))});
document.querySelector('#report').onclick=()=>goto(lastPage);
document.querySelector('#menu').onclick=()=>goto(1);
document.querySelector('#back').onclick=()=>goto(page-1);
document.querySelector('#next').onclick=()=>goto(page+1);
document.querySelector('#reset').onclick=()=>{if(confirm('Сбросить результаты всех игр и перемешать задания?')){state=fresh();save();goto(1)}};
document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('Открой презентацию в отдельной вкладке браузера. Полноэкранный режим зависит от устройства.')}catch{alert('Полноэкранный режим недоступен в этом окне. Открой HTML-файл в браузере.')}};
document.addEventListener('fullscreenchange',()=>document.querySelector('#full').textContent=document.fullscreenElement?'Выйти из полноэкранного режима':'На весь экран');
render();
</script></html>
