function numberCN(n){if(n>=100){let h=Math.floor(n/100),r=n%100;return numberCN(h)+'百'+(r===0?'':r<10?'零'+numberCN(r):numberCN(r))}const a=['零','一','二','三','四','五','六','七','八','九'];if(n<10)return a[n];if(n<20)return '十'+(n%10?a[n%10]:'');return a[Math.floor(n/10)]+'十'+(n%10?a[n%10]:'')}

function total(){return PRODUCTS.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0)}
function missionOK(){return PRODUCTS.every(p=>(cart[p.id]||0)===(MISSION[p.id]||0))&&total()<=BUDGET}

function cartHTML(){let sum=total();return `<aside class="panel cart"><div class="row spread"><h3><span class="cart-icon">${BASKETS[basket].icon}</span> Мои покупки</h3><button class="small" onclick="basketModal()">Сменить</button></div>${basketPicture(true)}<div id="cartitems" aria-live="polite">${PRODUCTS.filter(p=>cart[p.id]).map(p=>`<div class="cart-row">${image(idx(p.id))}<div><span class="cn">${p.cn}</span><small>${p.price} 元 / ${p.unit}</small><div class="counter"><button aria-label="Убрать ${p.ru}" onclick="change('${p.id}',-1)">−</button><span>${cart[p.id]} ${p.unit}</span><button aria-label="Добавить ${p.ru}" onclick="change('${p.id}',1)">+</button></div></div><strong>${p.price*cart[p.id]} 元</strong></div>`).join('')||'<div class="cart-empty">Пока пусто!<br>🍎 Загляни к продавцу.</div>'}</div><div class="cart-total"><div class="row spread"><b>Всего</b><strong>${sum} 元</strong></div><div class="${sum>BUDGET?'budget-over':''}">${sum>BUDGET?'Не хватает: '+(sum-BUDGET):'Останется: '+(BUDGET-sum)} 元 <span class="tiny">из ${BUDGET} 元</span></div></div><details><summary class="tiny" style="cursor:pointer;margin-top:12px">📋 Что осталось купить?</summary>${listHTML(true)}</details><div class="actions"><button class="primary" onclick="go(3)" style="width:100%">Проверить покупки →</button></div></aside>`}
function change(id,delta){let q=Math.max(0,Math.min(9,(cart[id]||0)+delta));if(q)cart[id]=q;else delete cart[id];paid=false;render()}
function openProduct(id){talkId=id;priceOpen=false;replyQty=1;renderTalk()}
function renderTalk(){let p=getP(talkId),q=replyQty;modal('У прилавка · '+p.ru,`<div class="product-talk">${image(idx(p.id))}<section><span class="pill">${p.unit==='斤'?'⚖️ На вес: 1 斤 = 500 г':'🍎 Поштучно: 个'}</span><div class="speech buyer"><div class="speaker">🧑 Покупатель · Спроси цену</div>${text(`${p.cn}多少钱一${p.unit}？`,`${p.py[0].toUpperCase()+p.py.slice(1)} duōshao qián ${p.unit==='斤'?'yì jīn':'yí ge'}?`,`Сколько стоит ${p.unit==='斤'?'500 г':'одна штука'}?`)}<button class="small" onclick="setReplyQty($('qty').value);priceOpen=true;renderTalk()">Показать ответ продавца</button></div>${priceOpen?`<div class="speech seller"><div class="speaker">🧑‍🌾 Продавец · Ответь</div>${text(`${p.price===2?'两':numberCN(p.price)}块钱一${p.unit}。`,'',`Цена: ${p.price} 元 за ${p.unit==='斤'?'500 г':'штуку'}.`)}</div>`:''}<div class="row"><label for="qty">Количество:</label><input id="qty" class="qtyinput" type="number" min="1" max="9" step="1" value="${q}" oninput="setReplyQty(this.value)"><span>${p.unit} ${p.unit==='斤'?'(по 500 г)':'(штуки)'}</span></div><div class="speech buyer"><div class="speaker">🧑 Покупатель · Сделай заказ</div><div id="orderline">${orderLine(p,q)}</div></div><div class="speech seller">${text(p.desc,p.dp,p.dr)}</div><div class="row spread"><strong id="lineprice">Цена покупки: ${q*p.price} 元</strong><button class="primary" onclick="addFromTalk()">${BASKETS[basket].icon} В корзину</button></div><div id="qtyfeedback" class="feedback"></div></section></div><details class="grammar"><summary>🧩 Как построить фразу?</summary>${grammar()}</details>`)}
function orderLine(p,q){return text(`我要${quantityCN(q)}${p.unit}${p.cn}。`,`Wǒ yào ${q===1?(p.unit==='斤'?'yì':'yí'):['','yī','liǎng','sān','sì','wǔ','liù','qī','bā','jiǔ'][q]} ${p.unit==='个'?'ge':p.up} ${p.py}.`,`Я хочу ${q} ${p.unit==='斤'?'斤 (по 500 г)':'шт.'} — ${p.ru.toLowerCase()}.`)}
function setReplyQty(v){let n=Number(v);if(!Number.isInteger(n)||n<1||n>9){$('qtyfeedback').textContent='Выбери целое количество от 1 до 9.';return}replyQty=n;let p=getP(talkId);$('orderline').innerHTML=orderLine(p,n);$('lineprice').textContent='Цена покупки: '+n*p.price+' 元';$('qtyfeedback').textContent=''}
function addFromTalk(){let n=Number($('qty').value);if(!Number.isInteger(n)||n<1||n>9){$('qtyfeedback').textContent='Выбери целое количество от 1 до 9.';return}if((cart[talkId]||0)+n>9){$('qtyfeedback').textContent='В корзинке может быть не больше 9 единиц одного продукта.';return}cart[talkId]=(cart[talkId]||0)+n;paid=false;let p=getP(talkId);closeModal();render();toast(`${p.cn} · +${n}${p.unit} ${BASKETS[basket].icon}`)}
function grammar(){return `<b>Спросить цену</b><div class="formula"><span>Продукт</span><b>＋</b><span>多少钱</span><b>＋</b><span class="qty">一</span><span class="unit">斤 / 个</span><b>？</b></div><b>Заказать</b><div class="formula"><span class="verb">我要 / 来</span><b>＋</b><span class="qty">Количество</span><b>＋</b><span class="unit">斤 / 个</span><b>＋</b><span>Продукт</span><b>。</b></div>${text('我要两个苹果。 / 来一斤香蕉。','Wǒ yào liǎng ge píngguǒ. / Lái yì jīn xiāngjiāo.','Я хочу два яблока. / Дайте 500 г бананов.')}<p class="tiny">💡 Перед 个 и 斤 говорим 两: 两个苹果、两斤香蕉。</p><b>Оценить товар</b><div class="formula"><span>Продукт</span><b>＋</b><span class="verb">很 / 有点儿 / 不</span><b>＋</b><span class="qty">Прилагательное</span></div>${text('草莓有点儿贵。香蕉很便宜。','Cǎoméi yǒudiǎnr guì. Xiāngjiāo hěn piányi.','Клубника немного дорогая. Бананы дешёвые.')}<p class="tiny">贵 — дорогой · 便宜 — дешёвый · 大 — большой · 小 — маленький · 好 — хороший</p>`}
function renderCheckout(){if(paid){renderFinal();return}
$('app').innerHTML=`<div class="stage-tag">Шаг 3 · Проверь покупки и рассчитайся</div><h2>Сколько с меня? 一共多少钱？</h2><div class="grid2"><section class="panel task"><div class="row spread"><h3>${BASKETS[basket].icon} Моя корзинка</h3><span class="pill">Бюджет: ${BUDGET} 元</span></div>${basketPicture()}${receiptTable()}<div class="row spread cart-total"><b>Сумма покупок</b><span class="money">${total()} 元</span></div><h3 style="margin-top:22px">Проверка списка</h3>${listHTML(true)}<button class="small" onclick="checkShopping()">🔎 Проверить покупки</button><div id="shoppingfeedback" class="feedback"></div></section><section class="panel"><div class="speech buyer"><div class="speaker">🧑 Покупатель</div>${text('一共多少钱？','Yígòng duōshao qián?','Сколько стоит всё вместе?')}</div><div class="speech seller"><div class="speaker">🧑‍🌾 Продавец</div>${text(`一共${numberCN(total())}块钱。`,'','Всего '+total()+' юаней.')}</div><label class="pay-label" for="sum">Сколько нужно заплатить?</label><div class="row"><input id="sum" class="qtyinput" type="number" min="0" max="99" inputmode="numeric" placeholder="Сумма"><b>元</b></div><label class="pay-label" for="change">Ты даёшь ${BUDGET} 元. Сколько получишь сдачи?</label><div class="row"><input id="change" class="qtyinput" type="number" min="0" max="${BUDGET}" inputmode="numeric" placeholder="Сдача"><b>元</b></div><div class="actions"><button class="primary" onclick="pay()">💰 Рассчитаться</button></div><div id="payfeedback" class="feedback" role="status"></div><div class="speech buyer">${text(`给你${numberCN(BUDGET)}块钱。`,`Gěi nǐ ${numberPY(BUDGET)} kuài qián.`,`Вот ${BUDGET} юаней.`)}</div><p class="tiny sub">Сначала произнеси реплики покупателя и продавца вслух.</p></section></div><div class="bottomnav"><button onclick="go(2)">← Вернуться за покупками</button></div>`}
function receiptTable(){return `<table class="checkout-table"><thead><tr><th>Продукт</th><th>Количество</th><th>Цена</th></tr></thead><tbody>${PRODUCTS.filter(p=>cart[p.id]).map(p=>`<tr><td><span class="cn">${p.cn}</span></td><td>${cart[p.id]} ${p.unit}</td><td>${cart[p.id]*p.price} 元</td></tr>`).join('')||'<tr><td colspan="3">В корзинке пока ничего нет.</td></tr>'}</tbody></table>`}
function shoppingErrors(){let msgs=[];for(let [id,q] of Object.entries(MISSION)){let p=getP(id),n=cart[id]||0;if(n<q)msgs.push(`Добавь ${q-n} ${p.unit}: ${p.cn}.`);if(n>q)msgs.push(`Убери ${n-q} ${p.unit}: ${p.cn}.`)}for(let p of PRODUCTS)if(cart[p.id]&&!MISSION[p.id])msgs.push(`В списке нет ${p.cn}. Верни товар продавцу.`);if(total()>BUDGET)msgs.push(`Бюджет превышен на ${total()-BUDGET} 元.`);return msgs}
function checkShopping(){let msgs=shoppingErrors();$('shoppingfeedback').className='feedback '+(msgs.length?'error':'success');$('shoppingfeedback').innerHTML=msgs.length?msgs.join('<br>'):'✓ Всё по списку! Теперь посчитай сумму и сдачу.'}
function pay(){let msgs=shoppingErrors(),s=$('sum').value.trim(),ch=$('change').value.trim();let f=$('payfeedback');f.className='feedback error';if(msgs.length){f.textContent='Сначала исправь покупки. Нажми «Проверить покупки» — появятся подсказки.';checkShopping();return}if(s===''||ch===''){f.textContent='Впиши сумму покупки и сдачу.';return}if(Number(s)!==total()){f.textContent='Проверь сумму покупки: сложи стоимость всех продуктов.';return}if(Number(ch)!==BUDGET-total()){f.textContent=`Проверь сдачу: из ${BUDGET} вычти сумму покупки.`;return}paid=true;completed.add(scenario);dialogueRole='both';render();window.scrollTo({top:0,behavior:'smooth'})}
function missionModal(){modal('📋 '+scene().title,`<div class="panel task">${text(scene().cn,scene().py,scene().ru)}${listHTML(true)}<div class="money">Бюджет: ${BUDGET} 元</div><p>Корзинка должна точно соответствовать списку. Лишние продукты можно убрать кнопкой «−».</p></div>`)}
function basketModal(){modal('Выбери корзинку',`<p>Твои покупки сохранятся.</p><div class="grid3">${BASKETS.map((b,i)=>`<button class="basket-choice ${basket===i?'chosen':''}" onclick="basket=${i};closeModal();render()"><span class="basket-icon">${b.icon}</span>${b.name}</button>`).join('')}</div>`)}
function vocab(){modal('🍊 Словарик рынка',`<p>Сначала назови продукт по-китайски, затем найди его на прилавке.</p><div class="vocab-grid">${PRODUCTS.map((p,i)=>`<article>${image(i)}${text(p.cn,p.py,p.ru)}<span class="pill">${p.price} 元 / ${p.unit}</span></article>`).join('')}</div><div class="guide-stripe" style="margin-top:20px">1 斤 = 500 г · 个 — счётное слово для отдельных предметов.<br>水果 shuǐguǒ — Фрукты · 蔬菜 shūcài — Овощи</div>`)}
function phrases(){modal('💬 Фразы покупателя',grammar()+`<div class="speech buyer">${text('太贵了！','Tài guì le!','Слишком дорого!')}</div><p class="tiny">Для разминки по исходному заданию: оцени два товара с 很、 有点儿 или 不, затем сделай заказ.</p>`)}
function guide(){modal('Как провести игру',`<ol><li><b>Прочитайте миссию.</b> Выберите одну из трёх ситуаций: пикник, семейный салат или поход в гости. У каждой свой список и бюджет. Смена ситуации очищает корзину.</li><li><b>Выберите корзинку.</b> Корзинка, сумка или тележка — выбор меняет внешний вид, покупки сохраняются.</li><li><b>Поговорите у прилавка.</b> Откройте продукт. Покупатель спрашивает цену; продавец отвечает. Затем покупатель выбирает количество и произносит заказ. После этого нажимает «В корзину».</li><li><b>Оцените товар.</b> Используйте фразы из файла: 很大、很小、有点儿贵、很便宜、不贵. Цветная схема доступна под диалогом.</li><li><b>Проверьте покупки.</b> Кнопками «+» и «−» исправьте количество. На кассе сравните корзинку со списком.</li><li><b>Рассчитайтесь.</b> Впишите сумму покупки и сдачу с бюджета выбранной ситуации. После оплаты появятся чек, картинка наполненной корзины и полный диалог по вашим покупкам.</li><li><b>Разыграйте сценку.</b> Прочитайте полный диалог вдвоём. Затем скройте реплики покупателя или продавца и повторите разговор по картинке корзины. В конце поменяйтесь ролями.</li></ol><p><b>В паре:</b> один ученик играет покупателя, другой — продавца. Ответ продавца сначала скрыт. <b>С учителем:</b> ученик делает заказ, учитель отвечает. <b>Самостоятельно:</b> сначала произнесите реплику, затем откройте ответ.</p><p>Игра рассчитана на 7–12 минут. Все картинки встроены, подключение к интернету не нужно. Реплики читаются вслух участниками.</p>`)}
function modal(title,body){$('mtitle').textContent=title;$('mbody').innerHTML=body;$('modal').hidden=false;document.body.style.overflow='hidden'}
function closeModal(){$('modal').hidden=true;document.body.style.overflow=''}
function toast(msg){if(toastTimer)clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,1800)}
function togglePy(){py=!py;$('pybtn').textContent=py?'Скрыть пиньинь':'Показать пиньинь';document.body.classList.toggle('hidepy',!py)}
function toggleRu(){ru=!ru;$('rubtn').textContent=ru?'Скрыть перевод':'Показать перевод';document.body.classList.toggle('hideru',!ru)}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else modal('На весь экран','<p>На телефоне поверните экран горизонтально. Для удобной работы откройте файл в браузере.</p>')}catch(e){modal('На весь экран','<p>Откройте HTML-файл в отдельной вкладке браузера и повторите попытку.</p>')}}
function resetAsk(){modal('Новая корзинка?',`<p>Все покупки и результаты будут сброшены. Начнём выбранную ситуацию заново.</p><button class="pink" onclick="resetGame()">Сбросить покупки</button>`)}
function resetGame(){cart={};basket=0;filter='all';paid=false;talkId=null;priceOpen=false;replyQty=1;go(1)}
function printReceipt(){let prev=dialogueRole;dialogueRole='both';if(paid)renderFinal();window.print();dialogueRole=prev;if(paid)renderFinal()}

function scenarioCards(){return `<div class="grid3 scenario-grid">${SCENARIOS.map((s,i)=>`<button class="scenario-card ${scenario===i?'selected':''}" onclick="chooseScenario(${i})" aria-pressed="${scenario===i}"><span class="scenario-icon">${s.icon}</span><b>${s.title}</b><span class="pill">Бюджет: ${s.budget} 元</span><span class="tiny">${Object.keys(s.mission).map(id=>getP(id).cn).join(' · ')}</span>${completed.has(i)?'<span class="done-stamp">✓ Пройдено</span>':''}</button>`).join('')}</div><p class="tiny sub">Смена ситуации очищает корзину. Картинки, цены и диалог соответствуют выбранному заданию.</p>`}
function chooseScenario(i){if(i!==scenario){scenario=i;MISSION=scene().mission;BUDGET=scene().budget;cart={};paid=false;filter='all';dialogueRole='both'}go(1)}
function numberPY(n){const a=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];if(n<10)return a[n];if(n<20)return 'shí'+(n%10?' '+a[n%10]:'');if(n<100)return a[Math.floor(n/10)]+'shí'+(n%10?' '+a[n%10]:'');let r=n%100;return a[Math.floor(n/100)]+' bǎi'+(r?' '+(r<10?'líng ':'')+numberPY(r):'')}
function qtyPY(q,p){return (q===1?(p.unit==='斤'?'yì':'yí'):q===2?'liǎng':numberPY(q))+' '+(p.unit==='个'?'ge':'jīn')+' '+p.py}
function basketPicture(compact=false){let items=PRODUCTS.filter(p=>cart[p.id]);return `<figure class="basket-figure ${compact?'compact':''}"><div class="basket-scene basket-style-${basket}" role="img" aria-label="${BASKETS[basket].name} с покупками: ${items.map(p=>p.ru+' '+cart[p.id]+p.unit).join(', ')||'Пока пусто'}"><div class="basket-handle"></div><div class="basket-fill">${items.map(p=>`<div class="basket-produce">${image(idx(p.id))}<span>${cart[p.id]} ${p.unit}</span></div>`).join('')||'<span class="basket-empty">Сюда положим покупки</span>'}</div><div class="basket-front"><span>${BASKETS[basket].icon} ${scene().icon}</span></div></div><figcaption>${items.length?'В корзинке — твои покупки':'Корзинка ждёт покупок'}</figcaption></figure>`}
function dialogueLines(){let lines=[['buyer','你好！','Nǐ hǎo!','Здравствуйте!'],['seller','你好！买点儿什么？','Nǐ hǎo! Mǎi diǎnr shénme?','Здравствуйте! Что хотите купить?']];for(let p of PRODUCTS.filter(p=>cart[p.id])){let q=cart[p.id];lines.push(['buyer',`${p.cn}多少钱一${p.unit}？`,`${p.py[0].toUpperCase()+p.py.slice(1)} duōshao qián ${p.unit==='斤'?'yì jīn':'yí ge'}?`,`Сколько стоит ${p.unit==='斤'?'500 г':'одна штука'}? (${p.ru})`]);lines.push(['seller',`${p.price===2?'两':numberCN(p.price)}块钱一${p.unit}。`,`${p.price===2?'Liǎng':numberPY(p.price)[0].toUpperCase()+numberPY(p.price).slice(1)} kuài qián ${p.unit==='斤'?'yì jīn':'yí ge'}.`,`Цена: ${p.price} 元 за ${p.unit==='斤'?'500 г':'штуку'}.`]);lines.push(['buyer',`我要${quantityCN(q)}${p.unit}${p.cn}。`,`Wǒ yào ${qtyPY(q,p)}.`,`Дайте ${q} ${p.unit==='斤'?'斤 (по 500 г)':'шт.'}: ${p.ru.toLowerCase()}.`]);lines.push(['seller','好的！','Hǎo de!','Хорошо!'])}lines.push(['buyer','一共多少钱？','Yígòng duōshao qián?','Сколько стоит всё вместе?'],['seller',`一共${numberCN(total())}块钱。`,`Yígòng ${numberPY(total())} kuài qián.`,`Всего ${total()} юаней.`],['buyer',`给你${numberCN(BUDGET)}块钱。`,`Gěi nǐ ${numberPY(BUDGET)} kuài qián.`,`Вот ${BUDGET} юаней.`],['seller',`找你${numberCN(BUDGET-total())}块钱。`,`Zhǎo nǐ ${numberPY(BUDGET-total())} kuài qián.`,`Ваша сдача: ${BUDGET-total()} 元.`],['buyer','谢谢！再见！','Xièxie! Zàijiàn!','Спасибо! До свидания!'],['seller','再见！','Zàijiàn!','До свидания!']);return lines}
function dialogueHTML(){return dialogueLines().map(([role,cn,py,ru],i)=>`<div class="speech ${role} dialogue-line"><div class="speaker">${role==='buyer'?'🧑 Покупатель · 买家':'🧑‍🌾 Продавец · 卖家'}</div>${dialogueRole==='both'||dialogueRole===role?text(cn,py,ru):`<div class="hidden-reply">💬 Твоя реплика — скажи по памяти!</div>`}</div>`).join('')}
function setDialogueRole(role){dialogueRole=role;$('dialoguebody').innerHTML=dialogueHTML();$('rolecontrols').innerHTML=roleControls()}
function roleControls(){return [['both','Показать весь диалог'],['seller','Скрыть покупателя'],['buyer','Скрыть продавца']].map(([v,label])=>`<button class="small ${v===dialogueRole?'primary':''}" onclick="setDialogueRole('${v}')" aria-pressed="${v===dialogueRole}">${label}</button>`).join('')}
function renderFinal(){$('app').innerHTML=`<section class="final-heading"><span class="tag">Миссия выполнена · ${scene().title}</span><h2>${scene().finish} 🎉</h2><p>Ты собрал(а) покупки. Теперь разыграйте весь разговор: от приветствия до сдачи.</p></section><div class="final-grid"><aside class="final-sidebar panel"><h3>${BASKETS[basket].icon} Всё в корзинке!</h3>${basketPicture()}${receiptTable()}<p class="money">Итого: ${total()} 元</p><p>Бюджет: ${BUDGET} 元 · Сдача: ${BUDGET-total()} 元</p><button class="small" onclick="printReceipt()">Печать чека и диалога / PDF</button></aside><section class="panel dialogue-panel"><img class="dialogue-art" src="${ART[12]}" alt="Покупатель и продавец разговаривают у фруктового прилавка"><h3>💬 Наш разговор на рынке</h3><div class="guide-stripe"><b>1.</b> Прочитайте диалог по ролям. <b>2.</b> Скройте реплики одной роли и повторите разговор. <b>3.</b> Поменяйтесь ролями.</div><div class="row" id="rolecontrols">${roleControls()}</div><div id="dialoguebody">${dialogueHTML()}</div></section></div><section class="scenario-section"><h3>Попробуем другую ситуацию?</h3>${scenarioCards()}</section><div class="bottomnav"><button onclick="go(2)">← Вернуться на рынок</button><button class="primary" onclick="resetAsk()">Повторить эту ситуацию</button></div>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
