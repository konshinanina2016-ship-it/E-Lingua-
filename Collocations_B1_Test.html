<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collocations B1</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#17334a;font:20px system-ui}header,footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 4%;background:#fff}header{position:sticky;top:0;z-index:2}main{max-width:1100px;margin:24px auto;padding:30px;background:white;border-radius:24px;min-height:65vh;box-shadow:0 8px 30px #17334a12}h1{font-size:clamp(30px,5vw,55px);color:#087f82;margin:10px 0}h2{font-size:26px}button,select,input,textarea{font:inherit;border:1px solid #b9d0d8;border-radius:12px;padding:10px;background:white;color:inherit}button{cursor:pointer;background:#e0f3ef}button:hover{background:#bce9df}button.primary{background:#087f82;color:white}textarea{width:100%;min-height:100px}input{max-width:100%}.item{padding:16px;margin:12px 0;background:#f3f7fa;border-radius:14px}.good{color:#087647}.bad{color:#b43c29}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.muted{color:#567080;font-size:16px}.hero{background:linear-gradient(120deg,#d6f3e8,#e7e6ff);padding:35px;border-radius:20px}footer{justify-content:space-between}details{margin:15px 0}summary{cursor:pointer;color:#087f82} @media(max-width:600px){main{margin:8px;padding:16px}body{font-size:17px}header{position:static}}</style><header><b>eChinese · English Lab</b><select id="nav" aria-label="Раздел"></select><button onclick="full()">⛶</button><button onclick="resetPage()">↻ Сброс задания</button><span id="totalClock" style="font-weight:bold;font-variant-numeric:tabular-nums">30:00</span><button id="timerStart" onclick="startTotal()">▶ Старт</button></header><main id="main"><h1>COLLOCATIONS • B1</h1><p>42 collocations · B1</p><p>Если интерактивные задания не появились, откройте скачанный файл в Chrome или Edge.</p></main><footer><button onclick="move(-1)">← Назад</button><span id="progress"></span><button class="primary" onclick="move(1)">Далее →</button></footer><script>const D={"v": [["get better", "поправляться; становиться лучше"], ["get into trouble", "попасть в неприятности"], ["get dark", "темнеть"], ["get rid of", "избавиться от"], ["get ready", "подготовиться"], ["get the sack", "быть уволенным"], ["get revenge", "отомстить"], ["get lost", "заблудиться"], ["get the job", "получить работу"], ["get on somebody’s nerves", "действовать на нервы"], ["get off somebody’s back", "оставить в покое"], ["get down to business", "приступить к делу"], ["get even with", "расквитаться с кем-либо"], ["go to sleep", "засыпать"], ["go red", "краснеть"], ["go over the top", "переборщить"], ["come to terms with", "принять неприятную ситуацию"], ["come in handy", "пригодиться"], ["reach a decision", "прийти к решению"], ["reach an agreement", "достичь соглашения"]]}; const TRAIN=false; const N=[["pair", "pyjamas", "пижама"], ["flash", "lightning", "вспышка молнии"], ["pint", "beer", "пинта пива"], ["can", "beer", "банка пива"], ["set", "traffic lights", "светофор"], ["bunch", "flowers", "букет цветов"], ["sheet", "paper", "лист бумаги"], ["bar", "soap", "кусок мыла"], ["pair", "sunglasses", "солнечные очки"], ["flock", "birds", "стая птиц"], ["tube", "toothpaste", "тюбик зубной пасты"], ["pair", "scissors", "ножницы"], ["flock", "sheep", "стадо овец"], ["set", "rules", "набор правил"], ["clap", "thunder", "раскат грома"], ["swarm", "bees", "рой пчёл"]], E=[["in charge of", "отвечать за", "Maya manages the whole team. She is … the team."], ["in trouble with", "иметь неприятности с", "He broke the school rules and is now … the head teacher."], ["on the safe side", "для подстраховки", "Take a spare key, just to be … ."], ["in search of", "в поисках", "We walked around town … our missing dog."], ["in his shoes", "на его месте", "If I were …, I would apologise to my friend."], ["on top of", "держать под контролем", "After organising her work, Anna is finally … the situation."]], X=[["a … of pyjamas", "pair"], ["a … of lightning", "flash"], ["a … of beer (568 ml)", "pint"], ["a … of beer (metal container)", "can"], ["a … of traffic lights", "set"], ["a … of flowers", "bunch"], ["a … of paper", "sheet"], ["a … of soap", "bar"], ["a … of sunglasses", "pair"], ["a … of birds", "flock"], ["a … of toothpaste", "tube"], ["a … of scissors", "pair"], ["a … of sheep", "flock"], ["a … of rules", "set"], ["a … of thunder", "clap"], ["a … of bees", "swarm"]], C=[["I packed a … of pyjamas for the overnight trip.", "pair"], ["A sudden … of lightning lit up the sky.", "flash"], ["The menu lists a … of beer (568 ml).", "pint"], ["He opened a metal … of beer.", "can"], ["Turn left at the next … of traffic lights.", "set"], ["She bought a … of flowers for her mother.", "bunch"], ["Write your name on a … of paper.", "sheet"], ["There is a … of soap next to the sink.", "bar"], ["Take a … of sunglasses to protect your eyes.", "pair"], ["A … of birds flew south together.", "flock"], ["We need a new … of toothpaste.", "tube"], ["Cut the ribbon with a … of scissors.", "pair"], ["A … of sheep was grazing in the field.", "flock"], ["Every club needs a clear … of rules.", "set"], ["A loud … of thunder woke us up.", "clap"], ["A … of bees flew out of the hive.", "swarm"]], T=[["He manages the project. (CHARGE) He is … the project.", "in charge of"], ["The teacher is angry with him for cheating. (TROUBLE) He is … the teacher.", "in trouble with"], ["Bring extra money as a precaution. (SAFE) Bring extra money to be … .", "on the safe side"], ["They are looking for a new flat. (SEARCH) They are … a new flat.", "in search of"], ["If I were him, I would wait. (SHOES) If I were …, I would wait.", "in his shoes"], ["She has the situation under control. (TOP) She is … the situation.", "on top of"]]; const $=x=>document.getElementById(x);const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');let page=0,timer;const saved={}, markup={};let locked=false;const names=['Старт','Словарь','Соедини части','Выбери по контексту','История: путешествие','История: работа','Исправь ошибку','Перефразируй','Закончи диалог','Ситуации','Ролевая игра','Случайный вызов','Моя история','Количества и группы','Лексика в контексте','Устойчивые выражения','Перефразирование: новые выражения','Новые ситуации для речи','Итог и оценка']; const LAST=names.length-1;$('nav').innerHTML=names.map((n,i)=>`<option value="${i}">${i+1}. ${n}</option>`).join('');$('nav').onchange=()=>{if(!locked)startTotal();save();page=+$('nav').value;render()};function move(d){if(!locked)startTotal();save();page=Math.max(0,Math.min(names.length-1,page+d));render()}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/[’]/g,"'").replace(/\s+/g,' ')}function quiz(rows,mode){return rows.map((r,i)=>`<div class="item"><b>${i+1}. ${esc(r[0])}</b><p>${mode==='select'?`<select data-answer="${esc(r[1])}"><option value="">Выберите...</option>${sh(r[2]).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input placeholder="Your answer" data-answer="${esc(r[1])}">`} <span class="feedback">${TRAIN?`<span class="good">Ответ: ${esc(r[1])}</span>`:""}</span></p></div>`).join('')+`<button class="primary" onclick="check()">Сохранить ответы</button><p id="score"></p>`}function save(){if(page===LAST||locked)return;let fields=[...$('main').querySelectorAll('input,select,textarea')];saved[page]=fields.map(e=>e.type==='checkbox'?e.checked:e.value);markup[page]=$('main').innerHTML;}

function result(){let n=0,total=82;for(let i of [2,3,4,5,6,7,13,14,15,16]){let d=document.createElement('div');d.innerHTML=markup[i]||'';[...d.querySelectorAll('[data-answer]')].forEach((e,j)=>{if(norm(saved[i]?.[j]||'')===norm(e.dataset.answer))n++})}return n}
function grade(){let n=result(), oral=[...document.querySelectorAll('.rubric')];let complete=oral.every(e=>e.value!=='');let m=oral.reduce((a,e)=>a+Number(e.value),0);let pct=(n+m)/102;let scale=Math.round(100+100*pct);let band=scale>=180?'C1 · A':scale>=173?'B2 · B':scale>=160?'B2 · C':scale>=140?'B1':scale>=120?'A2':'ниже A2';$('finalGrade').textContent=complete?`Итого: ${n+m}/102 (${Math.round(pct*100)}%). Учебный ориентир: ${scale}/200 — ${band}.`:'Выберите баллы по всем критериям.'}
function summary(){if(!locked)return '<h1>Итог теста</h1><p>Проверь, что все задания выполнены. После завершения ответы изменить нельзя.</p><button class="primary" onclick="finish()">Завершить и получить результат</button>';return `<h1>Results · B1</h1><div class="hero"><h2>Лексика: ${result()} / 82</h2><p>Невыполненные задания — 0 баллов.</p></div><h2>Оценка говорения преподавателем</h2><p>0 — не выполнено; 1–2 — ограниченно; 3 — соответствует B1; 4 — уверенно; 5 — отлично.</p>${['Грамматика и лексика','Связность речи','Произношение','Взаимодействие'].map(x=>`<div class="item">${x} <select class="rubric" onchange="grade()"><option value="">Выберите балл</option>${[0,1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')}<h2 id="finalGrade">Оценка после заполнения критериев</h2><p>Учебная шкала: 100–200, линейный пересчёт результата. Границы уровней ориентированы на Cambridge English Scale (FCE/B2 First). Это не официальный экзаменационный балл и не подтверждение уровня CEFR.</p>`}
function speak(text,words,model){return `<div class="item"><h2>${esc(text)}</h2>${TRAIN?`<p>Используй: ${esc(words)}</p>`:"<p>Используй изученные выражения самостоятельно.</p>"}<textarea placeholder="Запиши ключевые мысли или свой ответ"></textarea>${TRAIN?`<p class="good">Пример: ${esc(model)}</p>`:""}</div>`}function clock(){clearInterval(timer);let n=60;$('clock').textContent=n;timer=setInterval(()=>{$('clock').textContent=--n;if(n<=0)clearInterval(timer)},1000)}const situations=[['You are lost in a new city and it is getting dark. What do you do?','get lost • get dark • come in handy','I would ask for help. My phone could come in handy.'],['Your friend keeps checking your phone. How do you react?','get on my nerves • get off my back','It gets on my nerves. I would ask my friend to stop.'],['You have a job interview tomorrow. How do you prepare?','get ready • get the job • go to sleep','I would get ready tonight and go to sleep early.'],['Your friend played an embarrassing joke on you. What do you do?','go red • get revenge • get even with','I might go red, but I would not get revenge.'],['Your team cannot agree on a plan. What do you suggest?','reach an agreement • reach a decision • get down to business','Let’s get down to business and reach an agreement.'],['You have too many old things in your room.','get rid of • come in handy','I would get rid of old clothes but keep tools that might come in handy.'],['Your colleague has lost his job. Give advice.','get the sack • come to terms with • get better','He needs time to come to terms with it. Things may get better.']];function render(){clearInterval(timer);$('nav').value=page;$('progress').textContent=`${page+1} / ${names.length}`;let h=`<div class="muted">B1 · ${names[page]}</div>`;let q=(a,b)=>quiz(a,b);if(page===LAST){$('main').innerHTML=summary();return}if(markup[page]){$('main').innerHTML=markup[page];[...$('main').querySelectorAll('input,select,textarea')].forEach((e,i)=>{if(e.type==='checkbox')e.checked=saved[page][i];else e.value=saved[page][i];if(locked)e.disabled=true});return}switch(page){case 0:h+=`<div class="hero"><h1>COLLOCATIONS • B1</h1><h2>42 collocations · Speak with confidence</h2><p>От словосочетаний к живому общению.</p><button class="primary" onclick="startTotal();move(1)">Начать урок →</button></div>`;break;case 1:if(!TRAIN){h+='<h1>Vocabulary recall</h1><p>Вспомни выражения с get, go, come, reach, названия групп и единиц, а также устойчивые выражения с предлогами. В контрольной версии словарь скрыт.</p>';break}h+='<h1>Vocabulary</h1><p>Назови значение каждого выражения и составь предложение.</p><div class="grid">'+[...D.v,...N.map(([a,b,c])=>["a "+a+" of "+b,c]),...E.map(([a,b])=>[a,b])].map(([a,b])=>`<div class="item"><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join('')+'</div>';break;case 2:{let pairs=[['reach an','agreement'],['go over','the top'],['get rid','of'],['come in','handy'],['get down','to business'],['go to','sleep'],['get into','trouble'],['come to','terms with']];h+='<h1>Match the chunks</h1><p>Соедини начало и конец выражения.</p>'+q(sh(pairs).map(([a,b])=>[a,b,pairs.map(x=>x[1])]),'select');break}case 3:h+='<h1>Choose the best option</h1>'+q(sh([['I have a fever, but I hope to …','get better',['get better','go red','get lost']],['Take a torch. It may …','come in handy',['get the sack','come in handy','go red']],['After the interview, Mia hopes to …','get the job',['get revenge','get the job','get dark']],['Stop asking me about my homework!','Get off my back',['Get off my back','Get ready','Get lost in town']],['We bought 100 balloons for six guests. We …','went over the top',['got better','went over the top','reached a decision']],['The teams finally … on the rules.','reached an agreement',['got lost','went to sleep','reached an agreement']]]),'select');break;case 4:case 5:{let a=page===4?[['We … ready early.','got'],['We … lost near the station.','got'],['It started to … dark.','get'],['My phone map … in handy.','came'],['We … to sleep immediately.','went']]:[['Tom was often late and … into trouble.','got'],['He might … the sack.','get'],['Tom finally … a decision.','reached'],['He arrived early and … down to business.','got'],['He had to … to terms with his mistakes.','come']];h+='<h1>'+ (page===4?'A weekend adventure':'Trouble at work')+'</h1><p>Вставь глагол get, go, come или reach в нужной форме. Затем перескажи историю.</p>'+q(a);break}case 6:h+='<h1>Spot the mistake</h1><p>Напиши исправленное словосочетание.</p>'+q(sh([['We need to go rid of these boxes.','get rid of'],['She went to red when everyone looked at her.','went red'],['Let’s come down to business.','get down to business'],['His music gets in my nerves.','gets on my nerves'],['They reached to an agreement.','reached an agreement'],['He wants to get even to his brother.','get even with']]));break;case 7:h+='<h1>Say it differently</h1><p>Заполни пропуск, сохранив смысл и ключевое слово.</p>'+q(sh([['I want to throw away these clothes. (RID) I want to … these clothes.','get rid of'],['We finally decided. (REACHED) We finally …','reached a decision'],['His jokes annoy me. (NERVES) His jokes …','get on my nerves'],['She wanted revenge. (EVEN) She wanted to … him.','get even with'],['He was fired. (SACK) He …','got the sack'],['This tool might be useful. (HANDY) It might …','come in handy'],['She accepted the bad news. (TERMS) She … the news.','came to terms with'],['He wanted to take revenge. (GET) He wanted to …','get revenge']]));break;case 8:h+='<h1>Finish the dialogue</h1><p>Продолжи диалог двумя репликами. Затем разыграйте его.</p>'+sh([['A: Why are you still awake? You have an exam tomorrow.','get ready • go to sleep','B: I need to get ready first. A: Then go to sleep early.'],['A: We have spent twice our budget!','go over the top • reach an agreement','B: We went over the top. A: Let’s reach an agreement on what to return.'],['A: My brother keeps borrowing my things.','get on my nerves • get off my back','B: That would get on my nerves too. A: I wish he would get off my back.']]).map(x=>speak(...x)).join('');break;case 9:h+='<h1>What would you do?</h1><p>Говори 45–60 секунд, используй минимум два выражения.</p>'+sh(situations).map(x=>speak(...x)).join('');break;case 10:h+='<h1>Role-play</h1><p>Работайте в парах. Договоритесь о бюджете, месте и развлечениях.</p><div class="grid"><div class="item"><h2>Student A</h2>You want a big party with expensive decorations.</div><div class="item"><h2>Student B</h2>You want a small party and a simple plan.</div></div>'+speak('Find a compromise.','go over the top • reach an agreement • get down to business • come in handy','Let’s get down to business. How much can we spend? Let’s not go over the top. We can reach an agreement on a smaller budget.');break;case 11:h+='<h1>Speaking challenge</h1><p>Случайная ситуация. Подготовься за 15 секунд и говори минуту.</p><button onclick="resetPage()">🎲 Новая ситуация</button>'+speak(...sh(situations)[0]);break;case 12:h+='<h1>Your own story</h1><p>Выбери тему и составь 5–7 предложений. Используй минимум 5 выражений и 3 разных глагола.</p><select><option>A difficult day</option><option>A new job</option><option>A surprising trip</option></select><textarea id="story" placeholder="My story…"></textarea><button onclick="navigator.clipboard?.writeText(document.getElementById(&quot;story&quot;).value).catch(()=>{})">Копировать рассказ</button><p>Самопроверка:</p>'+['Я использовал 5 выражений','Я использовал 3 разных глагола','Я проверил формы глаголов и предлоги'].map(x=>`<label style="display:block"><input type="checkbox"> ${x}</label>`).join('');break;case 13:h+='<h1>Quantities & groups</h1><p>Вставь существительное, обозначающее группу, единицу или предмет.</p>'+q(sh(X).map(([a,b])=>[a,b,[...new Set(N.map(x=>x[0]))]]),'select');break;case 14:h+='<h1>Everyday English</h1><p>Впиши недостающее слово по контексту.</p>'+q(sh(C));break;case 15:h+='<h1>Prepositional expressions</h1><p>Выбери подходящее выражение.</p>'+q(sh(E).map(([a,b,c])=>[c,a,E.map(x=>x[0])]),'select');break;case 16:h+='<h1>Say it differently</h1><p>Перефразируй, используя ключевое слово.</p>'+q(sh(T));break;case 17:h+='<h1>Real-life speaking</h1><p>Ответь на вопросы, используя изученную лексику. В контрольной версии выбери одну ситуацию.</p>'+[['Packing for a trip: What five things would you take and why?','Use quantity expressions.','I would pack a pair of pyjamas, a tube of toothpaste and a bar of soap. I would take a pair of sunglasses and a sheet of paper, too.'],['A storm interrupts your picnic. Describe what happens and what you do.','Use weather and group expressions.','We saw a flash of lightning and heard a clap of thunder. A flock of birds flew away.'],['Your friend has problems at school. Give advice and explain who can help.','Use prepositional expressions.','If I were in his shoes, I would talk to the teacher in charge of the class.'],['Plan a surprise party with a partner. Agree on supplies and responsibilities.','Use expressions from all three groups.','Let’s get down to business. I will buy a bunch of flowers. Who is in charge of the food?']].map(x=>speak(...x)).join('');break}$('main').innerHTML=h;if(locked)$('main').querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);window.scrollTo(0,0)}let remaining=1800000, deadline=0, totalInterval=null;function updateTotal(){if(deadline)remaining=Math.max(0,deadline-Date.now());let sec=Math.ceil(remaining/1000);$('totalClock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(!remaining){clearInterval(totalInterval);totalInterval=null;deadline=0;$('timerStart').textContent='Время вышло';$('totalClock').style.color='#b43c29';save();locked=true;page=LAST;render()}}function startTotal(){if(TRAIN||locked)return;if(deadline||!remaining)return;deadline=Date.now()+remaining;totalInterval=setInterval(updateTotal,200);$('timerStart').textContent='Тест идёт';$('timerStart').disabled=true;updateTotal()}function toggleTotal(){if(deadline){updateTotal();deadline=0;clearInterval(totalInterval);totalInterval=null;if(remaining)$('timerStart').textContent='▶ Продолжить'}else startTotal()}function resetTotal(){if(locked)return;clearInterval(totalInterval);totalInterval=null;deadline=0;remaining=1800000;$('totalClock').style.color='';$('timerStart').textContent='▶ Старт';updateTotal()}render();</script></html>
