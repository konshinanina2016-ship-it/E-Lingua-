let s=rect(0,0,500,300,'#daf3e3',28)+circ(412,65,40,'#ffdb82')+circ(72,220,68,'#b8e1bd');
if(type==='cake')s+=rect(100,212,300,25,'#417960')+rect(120,150,260,65,'#f4a288')+rect(140,105,220,52,'#ffe4a3')+Array.from({length:n},(_,i)=>rect(149+i*190/Math.max(n,1),73,10,33,'#5fa9c5',3)+circ(154+i*190/Math.max(n,1),68,6,'#ffb340')).join('')+Array.from({length:8},(_,i)=>circ(140+i*30,174,6,'#fff1ca')).join('');

function render(){

if(idx<0){root.innerHTML='<article class="panel hero"><div><div class="tag">中文真棒 · Amazing Chinese 1 · Урок 12</div><h1>生日快乐！</h1><p><strong>Игровая презентация</strong><br>Числа, даты, возраст и день рождения</p><div class="row"><button class="go" onclick="go(0)">▶ Начать</button><button onclick="menu.showModal()">☰ Выбрать игру</button><button onclick="resetAll()">↺ Сбросить все игры</button></div><div class="summary"><div><b>28</b><small>игры</small></div><div><b>25</b><small>слов и выражений</small></div><div><b>离线</b><small>работает офлайн</small></div></div><p id="covermsg" role="status"></p></div>'+mascot('hero-dragon')+'</article><details class="panel" style="margin-top:12px"><summary>📚 Словарик урока</summary><div class="cards">'+vocab.map(w=>'<p><b>'+w[0]+'</b><br>'+w[1]+'<br>'+w[2]+'</p>').join('')+'</div></details>';return}

games[idx]()}
function instruction(t){el('<p class="muted">'+t+'</p>')}
function options(a,f,p='area'){el('<div class="row" id="opts"></div>',p);return a.map(v=>btn(v,()=>f(v),'','opts'))}
function qword(w=pick(vocab),reverse=false){return {q:reverse?w[2]:w[0],a:reverse?w[0]:w[2],opts:mix([w,...mix(vocab.filter(x=>x!==w)).slice(0,3)]).map(x=>x[reverse?0:2])}}
function checked(ok,a){point(ok);status(ok?'✅ Верно!':'❌ Ответ: '+a)}
function next(f){btn('Следующий →',f,'go')}
function sequence(fn){S.i=(S.i||0)+1;S.lock=false;S.msg='';repaint()}
function answerInput(a,label='Ваш ответ'){let input=document.createElement('input');input.placeholder=label;input.setAttribute('aria-label',label);by('area').append(input);let b=btn('Проверить',()=>{if(!input.value.trim())return;let ok=norm(input.value)===norm(a);checked(ok,a);b.disabled=true;S.lock=true},'go');b.disabled=!!S.lock;input.onkeydown=e=>{if(e.key==='Enter')b.click()};next(sequence)}
function roundQuestions(fn){S.deck??=mix(vocab);let i=S.i||0;if(i>=S.deck.length){instruction('🏁 Раунд завершён. Сбросьте игру, чтобы сыграть ещё раз.');return null}return fn(S.deck[i],i)}
function choice(q,after){el('<p class="zh">'+q.q+'</p>');let bs=options(q.opts,v=>{if(S.lock)return;S.lock=true;bs.forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('ok');else if(b.textContent===v)b.classList.add('bad')});let ok=v===q.a;checked(ok,q.a);after?.(ok)});if(S.lock)bs.forEach(b=>b.disabled=true);return bs}
function quiz(){instruction('Выберите перевод китайского слова.');let q=roundQuestions((w,i)=>S['q'+i]??=qword(w));if(q){choice(q);next(sequence)}}
function showQuiz(){instruction('15 секунд на вопрос, 3 жизни и один бонус «50/50» за игру.');S.life??=3;S.time??=15;if(!S.life&&!S.lock){status('Игра окончена. Сбросьте игру для нового раунда.');return}let q=roundQuestions((w,i)=>S['q'+i]??=qword(w,true));if(!q)return;

function flash(){instruction('Прочитайте слово, вспомните значение и переверните карточку.');S.deck??=mix(vocab);S.i??=0;let w=S.deck[S.i%S.deck.length];el('<p>Карточка '+(S.i%S.deck.length+1)+' / '+S.deck.length+'</p>');btn(S.back?w[1]+' · '+w[2]:w[0],()=>{S.back=!S.back;repaint()},'zh sel');btn('← Предыдущая',()=>{S.i=(S.i+24)%25;S.back=false;repaint()});next(()=>{S.back=false;sequence()})}
const speak=[['你今年几岁？','Nǐ jīnnián jǐ suì?','Сколько тебе лет?','我今年十岁。'],['你的生日是几月几日？','Nǐ de shēngrì shì jǐ yuè jǐ rì?','Когда твой день рождения?','我的生日是五月六日。'],['今天是几月几日？','Jīntiān shì jǐ yuè jǐ rì?','Какая сегодня дата?','今天是六月八日。'],['你是哪一年出生的？','Nǐ shì nǎ yì nián chūshēng de?','В каком году ты родился?','我是二零一六年出生的。'],['你说英文吗？','Nǐ shuō Yīngwén ma?','Ты говоришь по-английски?','我不说英文。'],['你多大了？','Nǐ duō dà le?','Сколько тебе лет?','我八岁了。'],['你是五月出生的吗？','Nǐ shì wǔ yuè chūshēng de ma?','Ты родился в мае?','是，我是五月出生的。']];
function speakCard(q){el('<p class="zh">'+q[0]+'</p><details><summary>Пиньинь и перевод</summary>'+q[1]+' · '+q[2]+'</details><details><summary>Пример ответа</summary>'+q[3]+'</details>')}
function wheel(){instruction('Крутите колесо и отвечайте по-китайски. В каждом круге вопросы идут без повторов.');el('<div id="wheel" class="wheel">🐲</div>');if(S.q)speakCard(S.q);btn('🎡 Крутить',()=>{if(by('wheel').classList.contains('spin'))return;by('wheel').classList.add('spin');later(()=>{if(!S.deck?.length)S.deck=mix(speak);S.q=S.deck.pop();repaint()},1050)},'go')}
function boxes(){instruction('Откройте коробку и выполните задание. Открытые коробки отмечаются.');S.deck??=mix(speak);S.open??=[];el('<div id="boxes" class="cards"></div>');S.deck.forEach((q,i)=>btn((S.open.includes(i)?'📭 ':'🎁 ')+(i+1),()=>{if(!S.open.includes(i))S.open.push(i);S.active=i;repaint()},S.open.includes(i)?'ok':'','boxes'));if(S.active!=null)speakCard(S.deck[S.active])}
function speaking(){instruction('Вытяните карточку и ответьте полным предложением. Можно использовать вымышленные данные.');S.deck??=mix(speak);let q=S.deck[S.i||0];if(q)speakCard(q);else status('🏁 Колода пройдена.');if(q)next(sequence)}
function watch(){instruction('Запомните количество свечей. Картинка исчезнет через 5 секунд.');S.n??=2+R(8);if(!S.started){btn('▶ Показать на 5 секунд',()=>{S.started=true;S.until=Date.now()+5000;repaint()},'go');return}let remaining=S.until-Date.now();if(remaining>0){el(art('cake',S.n));later(repaint,remaining);return}choice({q:'Сколько свечей было на торте?',a:D(S.n),opts:S.opts??=mix([D(S.n),...mix(nums.map(w=>w[0]).filter(c=>c!==D(S.n))).slice(0,3)])});next(()=>{delete S.n;delete S.started;delete S.until;delete S.opts;sequence()})}
function pairno(){instruction('Подходят ли китайское слово и его пиньинь друг другу?');let q=roundQuestions((w,i)=>S['q'+i]??={w,yes:!!R(2),wrong:pick(vocab.filter(x=>x!==w))});if(q){choice({q:q.w[0]+' · '+(q.yes?q.w[1]:q.wrong[1]),a:q.yes?'Пара':'Не пара',opts:['Пара','Не пара']});next(sequence)}}
function type(){instruction('Напечатайте ответ иероглифами. Подойдёт китайская клавиатура или рукописный ввод на телефоне.');let w=roundQuestions(w=>w);if(w){el('<p class="zh">'+w[2]+'</p>');answerInput(w[0],'Иероглифы')}}
function math(){instruction('Решите пример и запишите ответ китайским иероглифом. Все ответы от нуля до десяти.');S.op??='＋ и −';el('<div id="mathopts" class="row"></div>');['＋','−','＋ и −'].forEach(o=>btn(o,()=>{S.op=o;delete S.math;sequence()},o===S.op?'sel':'','mathopts'));let minus=S.op==='−'||S.op==='＋ и −'&&R(2);let a=R(11),b=minus?R(a+1):R(11-a);S.math??=[a,minus?'−':'＋',b,minus?a-b:a+b];let [x,op,y,z]=S.math;el('<p class="zh">'+D(x)+' '+op+' '+D(y)+' ＝ ？</p>');answerInput(D(z),'Ответ иероглифом');by('area').lastChild.onclick=()=>{delete S.math;sequence()}}
