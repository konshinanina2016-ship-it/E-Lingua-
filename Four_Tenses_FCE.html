<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four Tenses Workshop</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#193247;font:19px system-ui}header,footer{background:#173b50;color:white;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header b{color:#a9e7db}main{max-width:1050px;margin:24px auto;padding:25px;background:white;border-radius:22px;min-height:65vh}h1{font-size:clamp(28px,5vw,48px);color:#126e71}h2{color:#126e71}button,select,input,textarea{font:inherit;border:1px solid #b8cbd0;border-radius:10px;padding:10px}button{cursor:pointer;background:#e6f5f1;color:#173b50}button:hover{background:#c9e8df}button.active{background:#176d70;color:white}button:disabled{opacity:.45}article{border:1px solid #dbe5e8;border-radius:14px;padding:16px;margin:12px 0}p{line-height:1.5}.formula{background:#e3f3ee;padding:18px;border-radius:12px;font-size:25px}.example{background:#fff0d6;padding:18px;border-radius:12px}input,textarea{width:100%;margin-top:8px}textarea{min-height:90px}.options{display:flex;flex-wrap:wrap;gap:8px}.feedback{margin-top:8px;font-size:16px}.good{color:#147345}.bad{color:#a02d32}footer{justify-content:center;position:sticky;bottom:0}small{font-size:14px}select{max-width:100%}@media(max-width:600px){main{margin:8px;padding:15px}body{font-size:17px}}</style><header><b>eChinese · English Lab</b><select id="nav" aria-label="Содержание"></select><span id="clock">20:00</span><button id="timer">Начать FCE · 20 мин</button><button id="full">⛶</button><button id="reset">Сбросить всё</button></header><main id="main"></main><footer><button id="prev">← Назад</button><span id="pos"></span><button id="next">Далее →</button></footer><script>const D=[{"title": "1. Time detective", "inst": "Выберите время, соответствующее смыслу ситуации.", "mode": "choice", "rows": [{"q": "A finished event in 2019.", "opts": ["Past Progressive", "Present Perfect Simple", "Present Perfect Progressive", "Past Simple"]}, {"q": "An action in progress at 8 yesterday.", "opts": ["Past Simple", "Past Progressive", "Present Perfect Simple", "Present Perfect Progressive"]}, {"q": "Three reports completed so far.", "opts": ["Present Perfect Simple", "Past Progressive", "Past Simple", "Present Perfect Progressive"]}, {"q": "An ongoing activity causing tiredness now.", "opts": ["Past Progressive", "Present Perfect Simple", "Present Perfect Progressive", "Past Simple"]}]}, {"title": "2. Interrupted stories", "inst": "Выберите форму, которая передаёт указанный смысл.", "mode": "choice", "rows": [{"q": "While I ___ home, I saw an accident. (фоновый процесс)", "opts": ["walked", "have been walking", "have walked", "was walking"]}, {"q": "The lights went out while we ___ dinner.", "opts": ["were having", "have had", "had", "have been having"]}, {"q": "I ___ the door, picked up my bag and left.", "opts": ["was closing", "closed", "have been closing", "have closed"]}, {"q": "At midnight yesterday, the children ___ peacefully. (в процессе)", "opts": ["slept", "have been sleeping", "were sleeping", "have slept"]}, {"q": "She ___ her phone during the trip last week. (потеряла)", "opts": ["was losing", "lost", "has lost", "has been losing"]}]}, {"title": "3. Then or now?", "inst": "Выберите форму с учётом временного периода.", "mode": "choice", "rows": [{"q": "I ___ Paris in 2022.", "opts": ["visited", "was visiting", "have visited"]}, {"q": "I ___ Paris twice so far in my life.", "opts": ["visited", "have visited", "was visiting"]}, {"q": "We ___ the invoice yesterday.", "opts": ["paid", "have been paying", "have paid"]}, {"q": "The invoice is now paid. We ___ it. (результат)", "opts": ["were paying", "have paid", "have been paying"]}, {"q": "She ___ here from 2015 to 2020.", "opts": ["has been working", "has worked", "worked"]}]}, {"title": "4. Result or process?", "inst": "Выберите форму по смысловому акценту.", "mode": "choice", "rows": [{"q": "Look! I ___ all six windows. They are clean now.", "opts": ["have cleaned", "have been cleaning"]}, {"q": "My hands are dirty because I ___ the bike. It is still broken.", "opts": ["have repaired", "have been repairing"]}, {"q": "How many emails ___ today? (количество отправленных)", "opts": ["have you sent", "have you been sending"]}, {"q": "How long ___ for me? (ожидание продолжается)", "opts": ["did you wait", "have you been waiting"]}, {"q": "Someone ___ my cake! There is none left.", "opts": ["has eaten", "has been eating"]}]}, {"title": "5. State verbs", "inst": "Исправьте форму глагола: впишите только правильную форму.", "mode": "input", "rows": [{"q": "I have been knowing her since school. (know)", "opts": []}, {"q": "He has been owning this house since 2010. (own)", "opts": []}, {"q": "We have been believing this for years. (believe)", "opts": []}, {"q": "She has been needing glasses since childhood. (need)", "opts": []}, {"q": "I have been understanding the rule since Monday. (understand)", "opts": []}]}, {"title": "6. Grammar laboratory", "inst": "Раскройте скобки. Впишите только форму глагола, без сокращений.", "mode": "input", "rows": [{"q": "Yesterday I ___ (forget) my password.", "opts": []}, {"q": "At 9 last night we ___ (watch) a film when the alarm rang.", "opts": []}, {"q": "So far she ___ (write) four chapters.", "opts": []}, {"q": "He ___ (run) for an hour and is still running.", "opts": []}, {"q": "I ___ (not see) him since June.", "opts": []}, {"q": "What ___ (you / do) when I called?", "opts": []}]}, {"title": "7. Meaning match", "inst": "Выберите точную интерпретацию предложения.", "mode": "choice", "rows": [{"q": "I have been reading the book.", "opts": ["Акцент на процессе; конец не установлен.", "Книга точно прочитана.", "Действие точно было вчера."]}, {"q": "I read the book last week.", "opts": ["Я всё ещё читаю.", "Книга прочитана в прошлом.", "Я читаю прямо сейчас."]}, {"q": "I was reading when she arrived.", "opts": ["Чтение началось после прихода.", "Чтение продолжается до сих пор.", "Чтение уже шло в момент её прихода."]}, {"q": "I have read the book.", "opts": ["Книга прочитана; важен результат или опыт.", "Книга обязательно прочитана вчера.", "Чтение обязательно продолжается."]}]}, {"title": "8. Newsroom", "inst": "Дополните мини-истории формами глаголов.", "mode": "input", "rows": [{"q": "A: Why are you wet? B: I ___ (walk) in the rain for an hour. (акцент на процессе)", "opts": []}, {"q": "A: When did the storm start? B: It ___ (start) at six.", "opts": []}, {"q": "A: What were you doing then? B: I ___ (drive) home.", "opts": []}, {"q": "A: Is the road open now? B: Yes, workers ___ (clear) all the debris.", "opts": []}, {"q": "A: How long have they known about the problem? B: They ___ (know) since Monday.", "opts": []}]}, {"title": "9. Sentence builder", "inst": "Составьте предложение из перемешанных блоков. Нажимайте на слова по порядку.", "mode": "order", "rows": [{"q": "Опыт до настоящего", "opts": ["have", "tried", "sushi", "I", "never"]}, {"q": "Фоновое действие", "opts": ["arrived", "was", "cooking", "She", "when", "I"]}, {"q": "Процесс до настоящего", "opts": ["for", "waiting", "been", "have", "They", "hours"]}, {"q": "Завершённое прошлое", "opts": ["did", "We", "go", "out", "yesterday", "not"]}]}, {"title": "10. Translation challenge", "inst": "Переведите. Возможны другие грамматически верные варианты; сравните с образцом.", "mode": "open", "rows": [{"q": "Я потерял ключи вчера.", "opts": []}, {"q": "Когда ты позвонил, я готовила ужин.", "opts": []}, {"q": "Я уже отправил три письма.", "opts": []}, {"q": "Мы ждём автобус уже сорок минут.", "opts": []}, {"q": "Я знаю её с 2018 года.", "opts": []}]}, {"title": "11. Speaking studio", "inst": "Ответьте полными предложениями. Используйте указанное время.", "mode": "open", "rows": [{"q": "What did you do last weekend? (Past Simple)", "opts": []}, {"q": "What were you doing at 8 yesterday evening? (Past Progressive)", "opts": []}, {"q": "What have you achieved this month? (Present Perfect Simple)", "opts": []}, {"q": "What have you been doing to improve your English? (Present Perfect Progressive)", "opts": []}]}, {"title": "12. Final challenge", "inst": "Выберите наиболее подходящую форму.", "mode": "choice", "rows": [{"q": "I ___ three cups of coffee so far today.", "opts": ["have been drinking", "was drinking", "drank", "have drunk"]}, {"q": "I ___ coffee when the meeting began.", "opts": ["drank", "was drinking", "have drunk", "have been drinking"]}, {"q": "I ___ coffee at breakfast yesterday.", "opts": ["have drunk", "have been drinking", "was drinking", "drank"]}, {"q": "I ___ coffee all morning and my hands are shaking. (акцент на процессе)", "opts": ["have drunk", "was drinking", "have been drinking", "drank"]}, {"q": "She ___ the answer since yesterday.", "opts": ["has known", "has been knowing", "was knowing", "knew"]}, {"q": "He ___ the entire wall so far today. It is finished.", "opts": ["was painting", "has painted", "has been painting", "painted"]}, {"q": "When I entered, he ___ the wall.", "opts": ["was painting", "painted", "has been painting", "has painted"]}, {"q": "He ___ the wall for two hours and has not finished yet.", "opts": ["painted", "has been painting", "was painting", "has painted"]}]}, {"title": "13. FCE Part 1 · A community garden", "inst": "Прочитайте текст. Выберите форму для каждого пропуска.", "mode": "choice", "rows": [{"q": "1", "opts": ["was starting", "started", "has been starting", "has started"]}, {"q": "2", "opts": ["have been clearing", "cleared", "were clearing", "have cleared"]}, {"q": "3", "opts": ["were finding", "found", "have been finding", "have found"]}, {"q": "4", "opts": ["have been building", "built", "have built", "were building"]}, {"q": "5", "opts": ["have been growing", "were growing", "have grown", "grew"]}, {"q": "6", "opts": ["was knowing", "has known", "has been knowing", "knew"]}, {"q": "7", "opts": ["was visiting", "has been visiting", "visited", "has visited"]}, {"q": "8", "opts": ["have already signed up", "were already signing up", "already signed up", "have been signing up"]}], "passage": "Last April, our neighbourhood (1) ___ a community garden. While volunteers (2) ___ the ground, they (3) ___ an old stone path. So far, we (4) ___ exactly six raised beds, all ready to use. We (5) ___ vegetables for weeks and are still busy watering them every morning. Our coordinator (6) ___ the local gardeners since childhood. A journalist (7) ___ us last Friday. Twenty new volunteers (8) ___ for next month’s event so far."}, {"title": "14. FCE Part 2 · The podcast", "inst": "Вставьте ровно одно слово в каждый пропуск.", "mode": "input", "rows": [{"q": "1", "opts": []}, {"q": "2", "opts": []}, {"q": "3", "opts": []}, {"q": "4", "opts": []}, {"q": "5", "opts": []}, {"q": "6", "opts": []}, {"q": "7", "opts": []}, {"q": "8", "opts": []}], "passage": "I have (1) ___ recording a podcast (2) ___ September. Yesterday, I (3) ___ interviewing a musician (4) ___ the electricity went off. Luckily, I (5) ___ already saved three interviews this week. My friend asked, “What (6) ___ you do after the power cut?” I haven’t uploaded the latest episode (7) ___. We have been working on it (8) ___ two hours."}, {"title": "15. FCE Part 4 · Transformations", "inst": "Дополните второе предложение 2–5 словами, включая данное ключевое слово без изменений.", "mode": "input", "rows": [{"q": "I started learning Spanish two years ago. [BEEN] I ___ Spanish for two years.", "opts": []}, {"q": "The last time I saw Mia was in May. [SEEN] I ___ May.", "opts": []}, {"q": "During my walk, it began to rain. [WAS] It began to rain while ___ .", "opts": []}, {"q": "This is my first visit to Rome. [NEVER] I ___ Rome before.", "opts": []}, {"q": "When did you buy this bike? [HAVE] How long ___ this bike?", "opts": []}, {"q": "The team started training at nine and is still training. [BEEN] The team ___ nine.", "opts": []}], "passage": ""}, {"title": "16. FCE Part 5 · The repair café", "inst": "Прочитайте текст и выберите ответ, опираясь на смысл и временные формы.", "mode": "choice", "rows": [{"q": "Why did Ella first visit the café?", "opts": ["To teach a class", "To get a broken lamp repaired", "To buy a lamp", "To interview the founder"]}, {"q": "What was happening when Ella arrived?", "opts": ["A radio was being sold", "Ella was teaching", "Everyone had left", "A volunteer was fixing a radio"]}, {"q": "What does the number twelve refer to?", "opts": ["Weeks of training", "Completed repairs by Ella", "Broken radios", "New volunteers"]}, {"q": "What does “has been learning” emphasise?", "opts": ["An ongoing learning process", "A single past event", "A finished course", "A permanent skill"]}, {"q": "Why are Ella’s hands dirty?", "opts": ["She has bought a bicycle", "She lost her gloves yesterday", "She has been working on a bicycle", "She painted the café last year"]}, {"q": "What is the main message?", "opts": ["Old objects are always worthless", "Repairing things can build skills and community", "Volunteers should work alone", "Repairing is only for experts"]}], "passage": "Last winter, Ella visited a repair café because her favourite lamp had stopped working. When she arrived, a volunteer was fixing a radio. He invited her to watch. Ella returned the following Saturday and joined the team. Since then, she has repaired twelve household objects successfully. She has also been learning how to fix bicycles, a skill she is still developing. Today her hands are covered in oil: she has been working on a bicycle all morning. The café has changed her attitude to broken objects. She now sees them as opportunities to learn and meet people rather than things to throw away."}, {"title": "17. FCE Part 6 · A new habit", "inst": "Восстановите текст: выберите предложение A–G для каждого пропуска. Одно предложение лишнее.", "mode": "choice", "rows": [{"q": "1", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}, {"q": "2", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}, {"q": "3", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}, {"q": "4", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}, {"q": "5", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}, {"q": "6", "opts": ["B. Since then, I have been cycling to work regularly.", "D. So far, I have completed three charity rides.", "C. I bought my first bicycle last spring.", "F. I have known my cycling partner since school.", "E. My legs were aching because the route was so steep.", "G. The shop sells only winter coats.", "A. While I was checking the map, a cyclist stopped to help."]}], "passage": "My interest in cycling began with a purchase. (1) ___ On my first long ride, I got lost. (2) ___ He showed me a shortcut, but the hill was exhausting. (3) ___ Despite that, I decided to keep going. (4) ___ I rarely take the bus now. I usually ride with an old friend. (5) ___ We encourage each other to enter events. (6) ___ My next goal is a hundred-kilometre ride."}],T=[["Past Simple", "V2 / did not + V / Did + subject + V?", "Завершённое прошлое: yesterday, last week, in 2020, ago.", "I met her yesterday.", "Время может быть понятно из контекста, даже без маркера."], ["Past Progressive", "was/were + V-ing", "Фон, процесс в конкретный момент, параллельные процессы.", "I was cooking when he arrived.", "When не всегда требует Past Simple, while не всегда требует Progressive: важен смысл."], ["Present Perfect Simple", "have/has + V3", "Опыт, результат сейчас, количество, состояния до настоящего.", "I have finished three tasks.", "Не употребляем с законченным временем события: yesterday, in 2020."], ["Present Perfect Progressive", "have/has been + V-ing", "Длительность, повторяющаяся деятельность, недавний процесс с видимым эффектом.", "I have been working all morning.", "Процесс может продолжаться или только что закончиться."], ["Result vs process", "How many? / How long?", "I have painted the room — результат. I have been painting the room — процесс.", "I have lived here for years. / I have been living here for years.", "Обе формы иногда возможны: Simple нейтральнее, Progressive подчёркивает длительность."], ["State verbs & time markers", "since + начало / for + период", "know, own, believe, understand обычно не употребляются в Progressive.", "I have known him for years. / I have been thinking about it.", "Think = мнение (Simple), обдумывать (Progressive). Today может быть открытым периодом; for не гарантирует Progressive."]];let page=0,answers={},checked={},elapsed=0,running=false,finished=false,started=false,deadline=0;const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function randomize(){D.forEach(d=>d.rows.forEach(r=>{r.shuffled=d.mode==='order'?shuffle(r.opts):[...r.opts]}))}randomize();const names=['Обложка',...T.map(t=>t[0]),...D.map(d=>d.title),'Итоги'];names.forEach((n,i)=>$('nav').add(new Option(n,i)));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}function render(){let m=$('main');$('nav').value=page;$('pos').textContent=`${page+1} / ${names.length}`;$('prev').disabled=page===0;$('next').disabled=page===names.length-1;if(page===0){m.innerHTML='<h1>Four Tenses Workshop</h1><p>Past Simple · Past Progressive · Present Perfect Simple · Present Perfect Progressive</p><div class="formula">B1–B2 · 17 практических блоков · FCE Reading & Use of English</div><p>Сначала изучите правила, затем выполните задания. Ответы не показываются. Экзаменационный блок рассчитан на 20 минут.</p><button onclick="go(1)">Начать урок →</button>';return}if(page<=T.length){let t=T[page-1];m.innerHTML=`<h1>${t[0]}</h1><div class="formula">${t[1]}</div><p>${t[2]}</p><div class="example">${t[3]}</div><h2>Важный нюанс</h2><p>${t[4]}</p>`;return}let k=page-T.length-1;if(k===D.length){let total=0,correct=0,done=0;D.forEach((d,i)=>d.rows.forEach((r,j)=>{if(d.mode!=='open'){total++;if(answers[i+'-'+j])done++;}}));m.innerHTML=`<h1>Ваш результат</h1><div class="formula">${done} / ${total} · выполнено</div><p>Выполнено закрытых заданий: ${done} из ${total}. Ответы проверяет преподаватель.</p><button onclick="window.print()">Печать результата / PDF</button>`;return}let d=D[k];if(finished && k>=12){m.innerHTML="<h1>Время вышло</h1><p>Экзаменационный блок завершён.</p>";return;}m.innerHTML=`<h1>${d.title}</h1><p>${d.inst}</p>${d.passage?`<div class="example">${esc(d.passage)}</div>`:""}`;d.rows.forEach((r,j)=>{let id=k+'-'+j,v=answers[id]||'',a=document.createElement('article');a.innerHTML=`<b>${j+1}. ${esc(r.q)}</b>`;if(d.mode==='choice'){let o=document.createElement('div');o.className='options';r.shuffled.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=v===x?'active':'';b.onclick=()=>{answers[id]=x;delete checked[id];render()};o.append(b)});a.append(o)}else if(d.mode==='order'){let o=document.createElement('div');o.className='options';let used=v?v.split(' '):[];r.shuffled.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.disabled=used.includes(x);b.onclick=()=>{answers[id]=[...used,x].join(' ');delete checked[id];render()};o.append(b)});a.append(o);let p=document.createElement('p');p.textContent=v||'…';a.append(p);let b=document.createElement('button');b.textContent='Очистить';b.onclick=()=>{delete answers[id];delete checked[id];render()};a.append(b)}else{let inp=document.createElement(d.mode==='open'?'textarea':'input');inp.value=v;inp.placeholder='Ваш ответ';inp.oninput=()=>{answers[id]=inp.value;delete checked[id];let f=a.querySelector('.feedback');if(f)f.remove()};a.append(inp)}m.append(a)});let b=document.createElement('button');b.textContent=d.mode==='open'?'Показать образцы':'Проверить ответы';b.onclick=()=>{d.rows.forEach((r,j)=>checked[k+'-'+j]=true);render()};/* no answer reveal */}function go(i){if(i>=T.length+13 && i<T.length+1+D.length && !started){started=true;running=true;deadline=Date.now()+1200000;$('timer').textContent='Экзамен идёт';}page=Math.max(0,Math.min(names.length-1,i));render();window.scrollTo(0,0)}$('nav').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('reset').onclick=()=>{if(confirm('Начать заново и перемешать варианты?')){answers={};checked={};elapsed=0;running=false;finished=false;started=false;deadline=0;$('timer').textContent='Таймер';randomize();go(0)}};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};$('timer').onclick=()=>go(T.length+13);setInterval(()=>{let left=started?Math.max(0,Math.ceil((deadline-Date.now())/1000)):1200;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(started&&!left&&!finished){finished=true;running=false;go(names.length-1)}},250);render();</script></html>
